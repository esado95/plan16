services:
  plan16-web:
    image: nginx:alpine
    container_name: plan16-web
    restart: unless-stopped
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy

  plan16-api:
    build: ./server
    container_name: plan16-api
    restart: unless-stopped
    environment:
      CODEX_MODEL: gpt-5.6-terra
      COURSES_CSV: /courses-data/achats.csv
    volumes:
      - /home/said/courses-data/data/achats.csv:/courses-data/achats.csv:ro
      - /opt/docker/data/plan16/codex-home:/codex-home
    networks:
      - proxy

networks:
  proxy:
    external: true
