<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>План</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14161a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* Темы. Без выбора приложение следует системе; выбранная тема ставится
   атрибутом data-th на <html> и перекрывает всё. Шрифты только системные:
   загрузку внешних блокирует политика безопасности страницы. */
:root{
  --bg:#f3f2f6; --card:#ffffff; --line:#e3e2e9; --ink:#1b1c21; --muted:#6f717d;
  --a1:#c9622c; --a2:#2f7d5c; --warn:#9a6a15;
  --r:18px; --rb:7px; --cb:1px solid var(--line);
  --f:ui-rounded,-apple-system,"Segoe UI Variable",BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --fn:var(--f);
  --shadow:0 1px 2px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#141519; --card:#1e2027; --line:#343741; --ink:#f1eff4; --muted:#a4a6b0;
    --a1:#f0925a; --a2:#57b98f; --warn:#d3a04a; --shadow:none;
  }
}
:root[data-th="soft-light"]{
  --bg:#f3f2f6; --card:#ffffff; --line:#e3e2e9; --ink:#1b1c21; --muted:#6f717d;
  --a1:#c9622c; --a2:#2f7d5c; --warn:#9a6a15; --shadow:0 1px 2px rgba(0,0,0,.05);
}
:root[data-th="soft-dark"]{
  --bg:#141519; --card:#1e2027; --line:#343741; --ink:#f1eff4; --muted:#a4a6b0;
  --a1:#f0925a; --a2:#57b98f; --warn:#d3a04a; --shadow:none;
}
:root[data-th="instrument"]{
  --bg:#0b0d10; --card:#0f1216; --line:#23272e; --ink:#e6e8ea; --muted:#7d838c;
  --a1:#e08a3c; --a2:#4f9b7d; --warn:#d3a04a; --shadow:none;
  --r:4px; --rb:0px;
  --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --fn:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
:root[data-th="journal"]{
  --bg:#f6f4ef; --card:#f6f4ef; --line:#ddd7cb; --ink:#1b1a17; --muted:#8a8375;
  --a1:#a4593a; --a2:#3f6b52; --warn:#8a5a12; --shadow:none;
  --r:0px; --rb:50%; --cb:none;
  --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --fn:ui-serif,Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.55 var(--f);
  -webkit-text-size-adjust:100%;
}
/* Шапка и нижнее меню одинаковы на всех экранах: высота задана явно,
   иначе при пустом подзаголовке содержимое прыгает. */
header{
  position:fixed; top:0; left:0; right:0; z-index:5; background:var(--bg);
  height:calc(env(safe-area-inset-top) + 56px);
  padding:env(safe-area-inset-top) 16px 0;
  border-bottom:1px solid var(--line);
  display:flex; flex-direction:column; justify-content:center;
}
header h1,header .sub{margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
header h1{font-size:17px; font-weight:650; letter-spacing:-.01em; line-height:1.25}
header .sub{color:var(--muted); font-size:13px; line-height:1.3}
main{
  padding:16px 16px calc(env(safe-area-inset-bottom) + 78px);
  margin:calc(env(safe-area-inset-top) + 57px) auto 0; max-width:720px;
}
nav{
  position:fixed; left:0; right:0; bottom:0; z-index:6;
  display:flex; background:var(--card); border-top:1px solid var(--line);
  height:calc(env(safe-area-inset-bottom) + 54px);
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1; background:none; border:0; color:var(--muted); font:inherit; font-size:11px;
  padding:8px 2px 6px; cursor:pointer; line-height:1.25;
}
nav button b{display:block; font-size:17px; font-weight:400; margin-bottom:1px}
nav button.on{color:var(--a1)}
.card{
  background:var(--card); border:var(--cb); border-radius:var(--r);
  padding:14px 16px; margin-bottom:12px; box-shadow:var(--shadow);
}
:root[data-th="journal"] .card{border-bottom:1px solid var(--line); padding-left:0; padding-right:0}
.card.tight{padding:0; overflow:hidden}
h2{font-size:15px; font-weight:650; margin:0 0 10px; letter-spacing:-.01em}
h3{font-size:14px; font-weight:650; margin:16px 0 6px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:13px}
hr{border:0; border-top:1px solid var(--line); margin:14px 0}

/* шапка дня */
.day-head{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:2px}
.day-head .n{font-size:22px; font-weight:680; letter-spacing:-.02em}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.chip{
  font-size:13px; padding:5px 10px; border-radius:8px;
  background:color-mix(in srgb, var(--a1) 10%, transparent);
  color:var(--a1); border:1px solid color-mix(in srgb, var(--a1) 22%, transparent);
}
.chip.b{background:color-mix(in srgb, var(--a2) 10%, transparent); color:var(--a2);
  border-color:color-mix(in srgb, var(--a2) 22%, transparent)}
button.chip{cursor:pointer; font-family:inherit}

/* сводка дня */
.zone-h{display:flex; align-items:center; gap:9px; margin-bottom:4px}
.zone-h h2{margin:0; flex:1}
.zone-h i{
  width:26px; height:26px; border-radius:calc(var(--rb) + 2px); flex:none;
  display:grid; place-items:center; font-style:normal; font-size:14px;
}
:root[data-th="journal"] .zone-h i{display:none}
.pills{display:flex; gap:7px; margin-top:13px}
.pill{
  flex:1; background:var(--bg); border:var(--cb); border-radius:calc(var(--rb) + 5px);
  padding:9px 6px; text-align:center;
}
:root[data-th="journal"] .pill{border:0; border-top:1px solid var(--line); border-radius:0; text-align:left}
.prow{display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--line)}
.dot{width:9px; height:9px; border-radius:50%; flex:none}
.dot.ok{background:var(--a2)}
.dot.low{background:var(--warn)}
.dot.no{background:var(--line); border:1px solid var(--muted)}
.grp{
  padding:16px 0 2px; font-size:11.5px; letter-spacing:.05em;
  text-transform:uppercase; color:var(--muted);
}
.themes{display:flex; flex-wrap:wrap; gap:8px}
.th{
  font:inherit; font-size:13.5px; padding:9px 13px; cursor:pointer;
  background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:calc(var(--rb) + 4px);
}
.th.on{background:var(--a1); border-color:var(--a1); color:var(--bg); font-weight:600}
.parts{margin:12px 0 0; padding:0; list-style:none; font-size:13.5px}
.parts li{padding:6px 0; border-top:1px solid var(--line)}
.parts li:first-child{border-top:0}
.parts b{font-weight:600}
.pill b{display:block; font:700 16px/1.3 var(--fn)}
.pill span{font-size:10.5px; color:var(--muted)}
.ring{display:flex; align-items:center; gap:13px; margin:12px 0 4px}
.ring svg{flex:none}
.ring .n{font:680 20px/1.2 var(--fn); letter-spacing:-.02em}
.day-head .n, .big, .pill b{font-family:var(--fn)}
.step{
  background:var(--bg); border:1px solid var(--line); border-radius:8px; color:var(--ink);
  font:inherit; font-size:13px; padding:5px 10px; cursor:pointer;
}

/* таймлайн дня: одно дело — одна строка */
.tl{margin:0; padding:0; list-style:none}
.tl li{border-top:1px solid var(--line)}
.tl li:first-child{border-top:0}
.tl .row{display:flex; gap:10px; align-items:flex-start; padding:10px 0}
.tl .t{
  color:var(--a1); font:600 13px/1.4 var(--fn); font-variant-numeric:tabular-nums;
  min-width:42px; flex:none; padding-top:2px;
}
.tl label{display:flex; gap:10px; align-items:flex-start; flex:1; cursor:pointer}
.tl input[type=checkbox]{
  width:21px; height:21px; margin:0; accent-color:var(--a2); flex:none;
  border-radius:var(--rb);
}
.tl .txt{flex:1; font-size:14px; line-height:1.45}
.tl input:checked + .txt{color:var(--muted)}
.tl .more{
  background:none; border:0; color:var(--a1); font:inherit; font-size:13px;
  padding:0 0 10px 52px; cursor:pointer; display:block; text-align:left;
}
.tl .detail{padding:0 0 12px 52px}
.tl .detail .md{font-size:13.5px}
.tl .grp{padding:14px 0 2px; font-size:11.5px; color:var(--muted); letter-spacing:.05em; text-transform:uppercase}
.tl li.grp-row{border-top:0}

/* расписание */
.sched{margin:0; padding:0; list-style:none}
.sched li{display:flex; gap:12px; padding:6px 0; border-top:1px solid var(--line); font-size:14px}
.sched li:first-child{border-top:0}
.sched .t{color:var(--a1); font-variant-numeric:tabular-nums; font-weight:600; min-width:46px; flex:none}
.sched li.meal{align-items:flex-start}
.sched .body{flex:1}
.sched .tick{display:flex; gap:10px; align-items:flex-start; cursor:pointer}
.sched .tick input{width:20px; height:20px; margin:1px 0 0; accent-color:var(--a2); flex:none}
.sched .tick input:checked + span{color:var(--muted)}
.sched .more{
  background:none; border:0; color:var(--a1); font:inherit; font-size:13px;
  padding:5px 0 0 30px; cursor:pointer;
}
.sched li.detail{display:block; padding:2px 0 10px 58px; border-top:0}
.sched li.detail .md table{font-size:13px}

/* чек-лист */
.check{margin:0; padding:0; list-style:none}
.check li{border-top:1px solid var(--line)}
.check li:first-child{border-top:0}
.check label{display:flex; gap:11px; align-items:flex-start; padding:9px 0; cursor:pointer; font-size:14px}
.check input{width:21px; height:21px; margin:0; accent-color:var(--a2); flex:none}
.check input:checked + span{color:var(--muted); text-decoration:line-through}

/* поля ввода */
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(88px,1fr)); gap:10px}
.f{display:flex; flex-direction:column; gap:4px}
.f label{font-size:12px; color:var(--muted)}
input,select,textarea{
  font:inherit; font-size:16px; color:var(--ink); background:var(--bg);
  border:1px solid var(--line); border-radius:9px; padding:9px 10px; width:100%;
}
textarea{min-height:96px; resize:vertical; line-height:1.5; font-size:14px}
input:focus,textarea:focus,select:focus{outline:2px solid color-mix(in srgb,var(--a1) 45%,transparent); outline-offset:-1px}
.btn{
  display:inline-block; font:inherit; font-size:14px; font-weight:550;
  background:var(--bg); color:var(--ink); border:1px solid var(--line);
  border-radius:9px; padding:10px 14px; cursor:pointer; width:100%; text-align:center;
}
.btn.acc{background:var(--a1); border-color:var(--a1); color:#fff}
.btn + .btn{margin-top:8px}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.row2 .btn + .btn{margin-top:0}

/* списки */
.list{margin:0; padding:0; list-style:none}
.list li{border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list button{
  width:100%; text-align:left; background:none; border:0; font:inherit; color:inherit;
  padding:12px 16px; cursor:pointer; display:flex; gap:10px; align-items:baseline;
}
.list .k{color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; min-width:58px; flex:none}
.list .v{flex:1}
.list .v small{display:block; color:var(--muted); font-size:12.5px}
.list .chip{flex:none; align-self:center; font-size:12px; padding:3px 8px}
.list li.now{background:color-mix(in srgb,var(--a1) 7%,transparent)}
.list li.now .k{color:var(--a1); font-weight:600}

/* кухня */
main:has(.kitchen-shell){max-width:1080px}
.kitchen-shell{--k-accent:#df7841}
.kitchen-hero{
  padding:22px; overflow:hidden; position:relative;
  background:linear-gradient(135deg,color-mix(in srgb,var(--k-accent) 16%,var(--card)),var(--card) 62%);
}
.kitchen-hero::after{content:""; position:absolute; width:190px; height:190px; border-radius:50%; right:-70px; top:-92px;
  background:color-mix(in srgb,var(--k-accent) 12%,transparent); pointer-events:none}
.kitchen-kicker{font:650 11px/1.2 var(--fn); letter-spacing:.1em; text-transform:uppercase; color:var(--a1); margin-bottom:7px}
.kitchen-hero h2{font-size:25px; line-height:1.15; letter-spacing:-.035em; margin-bottom:6px}
.kitchen-hero p{max-width:560px; color:var(--muted); font-size:13.5px; margin-bottom:16px}
.food-search{position:relative; max-width:560px}
.food-search::before{content:"⌕"; position:absolute; left:13px; top:50%; transform:translateY(-52%); color:var(--muted); font-size:20px}
.food-search input{background:var(--card); padding:12px 14px 12px 40px; border-radius:12px; box-shadow:var(--shadow)}
.food-filters{display:flex; gap:7px; overflow-x:auto; padding:2px 1px 4px; margin:12px 0 18px; scrollbar-width:none}
.food-filters::-webkit-scrollbar{display:none}
.food-filter{flex:none; border:1px solid var(--line); background:var(--card); color:var(--muted); border-radius:999px;
  padding:8px 12px; font:550 12.5px/1 var(--f); cursor:pointer}
.food-filter b{font-weight:650; margin-left:4px; color:inherit}
.food-filter.on{background:var(--ink); border-color:var(--ink); color:var(--bg)}
.kitchen-section-head{display:flex; align-items:end; justify-content:space-between; gap:12px; margin:2px 2px 10px}
.kitchen-section-head h2{font-size:18px; margin:0}
.kitchen-section-head span{font-size:12.5px; color:var(--muted)}
.recipe-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px}
.recipe-card{background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; cursor:pointer;
  padding:0; text-align:left; font:inherit; color:inherit; box-shadow:var(--shadow); transition:transform .15s ease,border-color .15s ease}
.recipe-card:hover{transform:translateY(-2px); border-color:color-mix(in srgb,var(--a1) 35%,var(--line))}
.recipe-media{display:block; position:relative; aspect-ratio:16/11; overflow:hidden; background:color-mix(in srgb,var(--a1) 8%,var(--bg))}
.recipe-media img{width:100%; height:100%; object-fit:cover; display:block}
.recipe-placeholder{height:100%; display:grid; place-items:center; color:color-mix(in srgb,var(--a1) 60%,var(--muted));
  background:radial-gradient(circle at 70% 20%,color-mix(in srgb,var(--a1) 17%,transparent),transparent 45%),
    linear-gradient(145deg,color-mix(in srgb,var(--a2) 8%,var(--bg)),var(--bg)); font:600 26px/1 var(--fn)}
.recipe-badge{position:absolute; left:9px; top:9px; padding:5px 8px; border-radius:999px; background:rgba(18,19,23,.76);
  color:#fff; backdrop-filter:blur(7px); font-size:10.5px; line-height:1}
.recipe-copy{display:block; padding:12px 13px 14px}
.recipe-copy b{display:block; font-size:14px; line-height:1.3; font-weight:650}
.recipe-copy small{display:block; color:var(--muted); font-size:12.5px; line-height:1.35; margin-top:4px}
.recipe-section + .recipe-section{margin-top:22px}
.recipe-compact-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:8px}
.recipe-compact{display:flex; align-items:center; gap:12px; min-height:82px; padding:13px 14px; background:var(--card);
  border:1px solid var(--line); border-radius:14px; color:inherit; font:inherit; text-align:left; cursor:pointer; box-shadow:var(--shadow)}
.recipe-compact:hover{border-color:color-mix(in srgb,var(--a1) 35%,var(--line))}
.recipe-compact .compact-mark{width:38px; height:38px; flex:none; display:grid; place-items:center; border-radius:11px;
  background:color-mix(in srgb,var(--a1) 11%,transparent); color:var(--a1); font:700 11px/1 var(--fn); letter-spacing:.05em}
.recipe-compact .recipe-copy{padding:0; flex:1}
.recipe-compact .compact-arrow{color:var(--muted); font-size:16px}
.kitchen-empty{display:none; text-align:center; color:var(--muted); padding:34px 12px}
.kitchen-library{margin-top:20px}
.kitchen-library h2{font-size:18px; margin:0 2px 9px}
.kitchen-links{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:8px}
.kitchen-link{display:flex; align-items:center; gap:11px; padding:12px 13px; border:1px solid var(--line); border-radius:13px;
  color:inherit; background:var(--card); font:inherit; text-align:left; cursor:pointer}
.kitchen-link i{width:34px; height:34px; border-radius:10px; display:grid; place-items:center; font-style:normal;
  color:var(--a1); background:color-mix(in srgb,var(--a1) 10%,transparent)}
.kitchen-link span{flex:1; font-size:13.5px; font-weight:600; line-height:1.25}
.kitchen-link small{display:block; color:var(--muted); font-size:11.5px; font-weight:400; margin-top:2px}
.recipe-back{width:auto; margin-bottom:12px; padding-left:0; border:0; background:none; color:var(--muted); text-align:left}
.recipe-view{overflow:hidden; padding:0}
.recipe-view .photo{width:100%; max-height:520px; aspect-ratio:16/9; object-fit:cover; display:block}
.recipe-head{padding:18px 20px 6px}
.recipe-head h2{font-size:25px; line-height:1.15; margin-bottom:6px}
.recipe-head .recipe-ru{font-size:15px; color:var(--muted); margin:0 0 9px}
.recipe-body{padding:4px 20px 22px}
.food-add{display:grid;grid-template-columns:minmax(0,1fr) 92px auto;gap:8px;margin-top:12px}
.food-add select,.food-add input{min-width:0;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);padding:9px 10px;font:inherit}
.food-log{margin:10px 0 0;padding:0;list-style:none}.food-log li{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.food-log li span{flex:1}.food-log small{display:block;color:var(--muted)}
@media(max-width:560px){
  .kitchen-hero{padding:18px 16px}.kitchen-hero h2{font-size:22px}
  .recipe-grid{grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px}
  .recipe-card{border-radius:13px}.recipe-copy{padding:10px}.recipe-copy b{font-size:13px}.recipe-copy small{font-size:11.5px}
  .recipe-media{aspect-ratio:4/3}.kitchen-links{grid-template-columns:1fr 1fr}.kitchen-link{padding:10px; gap:8px}
  .recipe-compact-grid{grid-template-columns:1fr}.recipe-compact{min-height:72px;padding:11px 12px}
  .kitchen-link i{display:none}.recipe-view .photo{aspect-ratio:4/3}.recipe-head{padding:16px 16px 4px}.recipe-body{padding:4px 16px 18px}
  .food-add{grid-template-columns:1fr 82px}.food-add button{grid-column:1/-1}
}

/* дневник */
.big{font-size:34px; font-weight:680; letter-spacing:-.03em; line-height:1.1}
.big span{font-size:15px; font-weight:400; color:var(--muted)}
.nums{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:10px 0 4px; text-align:center}
.nums div{background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:7px 2px}
.nums b{display:block; font-size:17px; font-weight:650; letter-spacing:-.01em}
.nums span{font-size:11px; color:var(--muted)}
.nums div.over b{color:var(--warn)}
.nums div.under b{color:var(--warn)}
.note{
  font-size:13px; margin-top:10px; padding:9px 12px; border-radius:9px;
  background:color-mix(in srgb,var(--warn) 12%,transparent); color:var(--ink);
}
.delta{font-size:14px; margin-top:4px}
.down{color:var(--a2)} .up{color:var(--warn)}
svg.chart{width:100%; height:150px; display:block; margin:8px 0 4px}

/* текст из markdown */
.md{font-size:14.5px}
.md :first-child{margin-top:0}
.md :last-child{margin-bottom:0}
.md h3{font-size:14px}
.md ul,.md ol{margin:0 0 10px; padding-left:20px}
.md li{margin-bottom:3px}
.md code{
  font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;
  background:var(--bg); border:1px solid var(--line); border-radius:5px; padding:1px 5px;
}
.md blockquote{
  margin:12px 0; padding:10px 13px; border-left:3px solid var(--a1);
  background:color-mix(in srgb,var(--a1) 7%,transparent); border-radius:0 8px 8px 0;
}
.md blockquote :last-child{margin-bottom:0}
.md table{width:100%; border-collapse:collapse; font-size:13.5px; margin:0 0 10px; display:block; overflow-x:auto}
.md th,.md td{border:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top}

<body>

<header>
  <h1 id="h-title">План</h1>
  <div class="sub" id="h-sub"></div>
</header>

<main id="view"></main>

<nav>
  <button data-tab="today" class="on"><b>◉</b>Сегодня</button>
  <button data-tab="plan"><b>▤</b>План</button>
  <button data-tab="food"><b>◍</b>Кухня</button>
  <button data-tab="ai"><b>✦</b>Чат</button>
  <button data-tab="more"><b>⚙</b>Ещё</button>
</nav>

<input type="file" id="file" accept=".json,application/json" hidden>

<script>
'use strict';

const DKEY = 'plan16.data';
const SKEY = 'plan16.state';
const WD = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const WD_SHORT = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const MON = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const API = '/api/plan16';

let D = null;                 // содержимое: периоды, блюда, документы
let S = blank();              // дневник и настройки — только моё
let tab = 'today';
let openDay = null;           // какой день раскрыт на вкладке «План»
let openRow = null;           // какая строка дня раскрыта
let openRecipe = null;
let openDoc = null;           // какой справочник открыт на вкладке «Кухня»
let foodFilter = 'all';
let foodQuery = '';
let syncDraft = null;         // предпросмотр новых чеков перед добавлением
let syncMessage = '';
let aiWaiting = false;

function blank(){ return {v:1, kind:'journal', log:{}, periods:[], rep:{}, stock:{}, ui:{}, ai:{messages:[],tickets:[],purchases:[],lastImport:null}}; }

/* ─────────────── остатки продуктов ─────────────── */

function stockList(){ return (D && D.stock && D.stock.items) || []; }
function stockCats(){ return (D && D.stock && D.stock.cats) || []; }
function stockLeft(id){ return ((S.stock || {})[id]) || 0; }

function daysLeft(p){
  return p.perDay ? stockLeft(p.id) / p.perDay : null;
}

/* Сколько всего в категории — складываются только однородные единицы. */
function catLeft(cat){
  return stockList()
    .filter(function(p){ return p.cat === cat.id && p.unit === cat.unit; })
    .reduce(function(a, p){ return a + stockLeft(p.id); }, 0);
}

function catDays(cat){
  return cat.perDay ? catLeft(cat) / cat.perDay : null;
}

/* Уходить в минус разрешено намеренно: это «не хватило столько-то».
   Если обрезать по нулю, снятая галочка вернёт больше, чем списала. */
function addStock(id, delta){
  if (!S.stock) S.stock = {};
  S.stock[id] = Math.round(((S.stock[id] || 0) + delta) * 10) / 10;
}

/* Съел приём — списалось; снял отметку — вернулось.
   Списывается только однозначное: закреплённые за приёмом продукты и выбранный
   гарнир. Мясо и овощи в плане заданы категорией, а не конкретным продуктом,
   поэтому их остаток ведётся руками — врать точностью тут хуже, чем не считать. */
function applyMeal(idx, sign, day){
  const N = nut();
  const meal = N && N.meals[idx - 1];
  if (!meal) return;

  const hits = function(p, text){
    const t = String(text).toLowerCase();
    return (p.keys || []).some(function(k){ return t.indexOf(k) >= 0; });
  };

  for (const p of stockList()){
    if (!p.perDay) continue;
    if (meal.items.some(function(it){ return hits(p, it.name); })) addStock(p.id, -p.perDay * sign);
  }

  const sel = chosenSide(day);
  if (sel && isSideMeal(meal)){
    const p = stockList().find(function(x){ return hits(x, sel.name) || hits(x, sel.ru); });
    if (p) addStock(p.id, -sideGrams(sel) * sign);
  }
}

function applyTrip(tripId, sign){
  const t = ((D && D.shopping) || []).find(function(x){ return x.id === tripId; });
  if (!t) return;
  for (const it of (t.items || [])) addStock(it.product || it.id, it.qty * sign);
}

function stockSummary(){
  const empty = stockCats().filter(function(c){ return c.perDay && catLeft(c) <= 0; });
  const low = stockCats().filter(function(c){ const d = catDays(c); return d != null && d > 0 && d < 1; });
  const bad = empty.concat(low);
  return bad.length
    ? 'кончается: ' + bad.map(function(c){ return c.name.toLowerCase(); }).join(', ')
    : 'остатки по категориям';
}

/* Состояние продукта: нет / мало / есть. По нему же работает фильтр. */
function stockState(p){
  const left = stockLeft(p.id), d = daysLeft(p);
  if (left <= 0) return 'нет';
  if (d != null && d < 1) return 'мало';
  return 'есть';
}

const STOCK_FILTERS = [
  {id: '',     name: 'Всё'},
  {id: 'нет',  name: 'Чего нет'},
  {id: 'мало', name: 'Кончается'},
  {id: 'есть', name: 'Есть'}
];

function setStockFilter(id){
  if (!S.ui) S.ui = {};
  S.ui.stockFilter = id;
  save();
  render();
}

function stockScreen(){
  const flt = (S.ui || {}).stockFilter || '';
  const list = stockList().filter(function(p){ return !flt || stockState(p) === flt; });

  let h = '<button class="btn" onclick="openD(null)">← Кухня</button><div style="height:12px"></div>';
  h += '<div class="card"><h2>Продукты</h2><div class="themes">';
  for (const f of STOCK_FILTERS){
    const n = f.id ? stockList().filter(function(p){ return stockState(p) === f.id; }).length : stockList().length;
    h += '<button class="th' + (f.id === flt ? ' on' : '') + '" onclick="setStockFilter(\'' + f.id + '\')">' +
      esc(f.name) + ' <span class="muted">' + n + '</span></button>';
  }
  h += '</div>';

  if (!list.length) h += '<p class="small muted" style="margin-top:12px">Здесь пусто.</p>';

  for (const cat of stockCats()){
    const mine = list.filter(function(p){ return p.cat === cat.id; });
    if (!mine.length) continue;

    const days = catDays(cat);
    const have = stockList().filter(function(p){ return p.cat === cat.id && stockLeft(p.id) > 0; }).length;
    const total = stockList().filter(function(p){ return p.cat === cat.id; }).length;
    const sum = cat.perDay
      ? fmt(catLeft(cat), 0) + ' ' + cat.unit + ' · ' +
        (days < 1 ? 'на сегодня не хватит' : 'хватит на ' + plural(Math.floor(days), 'день', 'дня', 'дней'))
      : 'есть ' + have + ' из ' + total;

    h += '<details' + (flt ? ' open' : '') + '><summary>' + esc(cat.name) +
      '<br><span class="muted small"' + (cat.perDay && days < 1 ? ' style="color:var(--warn)"' : '') + '>' +
      sum + '</span></summary>';

    for (const p of mine){
      const left = stockLeft(p.id), d = daysLeft(p), st = stockState(p);
      const note = left < 0 ? 'не хватило ' + Math.abs(left)
        : st === 'нет' ? 'нет дома'
        : d == null ? 'есть'
        : d < 1 ? 'на сегодня не хватит'
        : 'хватит на ' + plural(Math.floor(d), 'день', 'дня', 'дней');
      h += '<div class="prow">' +
        '<span class="dot ' + (st === 'есть' ? 'ok' : st === 'мало' ? 'low' : 'no') + '"></span>' +
        '<span style="flex:1">' + esc(p.name) +
        '<br><span class="muted small">' + note + '</span></span>' +
        '<input type="text" inputmode="decimal" onchange="setStock(this)" data-stock="' + p.id + '" ' +
        'value="' + fmt(left, 0) + '" style="width:76px; text-align:right">' +
        '<span class="muted small" style="min-width:22px">' + esc(p.unit) + '</span></div>';
    }
    h += '</details>';
  }
  h += '<p class="hint">Списываются сами только яйца, fromage blanc и выбранный гарнир. ' +
    'Мясо и овощи в плане заданы категорией, а не конкретным продуктом, — их правь руками.</p></div>';

  // списки покупок и вся проза — отдельными свёрнутыми блоками, чтобы не мешались
  const trips = (D && D.shopping) || [];
  if (trips.length){
    h += '<div class="card"><h2>Списки покупок</h2>';
    for (const t of trips){
      h += '<details><summary>' + esc(t.title) + '</summary><div class="md">' + t.html + '</div></details>';
    }
    h += '</div>';
  }

  const doc = ((D && D.docs) || []).find(function(x){ return x.id === 'achats'; });
  if (doc){
    h += '<div class="card"><h2>Как покупать</h2>';
    if (doc.html) h += '<div class="md">' + doc.html + '</div>';
    for (const s of doc.sections){
      if (s.level !== 1 || s.title === doc.title) continue;
      if (trips.some(function(t){ return t.title === s.title; })) continue;
      if (!s.html) continue;
      h += '<details><summary>' + esc(s.title) + '</summary><div class="md">' + s.html + '</div></details>';
    }
    h += '</div>';
  }
  return h;
}

function setStock(el){
  const v = num(el.value);
  if (!S.stock) S.stock = {};
  S.stock[el.dataset.stock] = v == null ? 0 : Math.max(0, v);
  save();
  render();
}

/* ─────────────── Lidl и AI ─────────────── */

const PACK_GRAMS = {
  '0083009':200, '0083015':250, '0025808':300, '0149943':160, '0000449':300,
  '0153924':240, '0152058':150, '5605644':300, '0183018':400,
  '0001638':400, '5613066':500, '5621955':500, '0129674':200,
  '5621466':1000, '0137915':200, '0118290':380
};
const PACK_ML = {
  '5622850':1000,
  '5611991':2000,
  // На фактической банке Саида 200 мл; строка чека размер не содержит.
  '0175094':200
};

function aiState(){
  if (!S.ai) S.ai = {messages:[], tickets:[], purchases:[]};
  if (!S.ai.messages) S.ai.messages = [];
  if (!S.ai.tickets) S.ai.tickets = [];
  if (!S.ai.purchases) S.ai.purchases = [];
  if (!S.ai.migrations) S.ai.migrations = {};
  // Чек 04.08 мог быть подтверждён до появления правил для этих позиций.
  // Восстанавливаем только то, что старый импорт гарантированно пропустил.
  const fixedReceipt = '1200093422026080420938';
  if (S.ai.tickets.indexOf(fixedReceipt) >= 0 && !S.ai.migrations.aug04Missing){
    addStock('bananes', 782);
    addStock('protein_bar', 4);
    addStock('coca_zero', 8000);
    addStock('redbull_zero', 800);
    S.ai.migrations.aug04Missing = 1;
    save();
  }
  return S.ai;
}

function fmtQty(q, unit){
  if ((unit === 'г' || unit === 'мл') && q >= 1000) return fmt(q / 1000) + (unit === 'г' ? ' кг' : ' л');
  return fmt(q) + ' ' + unit;
}

function normText(s){
  return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
}

function purchaseProduct(item){
  const name = normText(item.name);
  return stockList().find(function(p){
    return (p.keys || []).some(function(k){ return name.indexOf(normText(k)) >= 0; });
  });
}

function purchaseQty(item, p){
  const count = Number(item.quantity) || 0;
  if (p.unit === 'шт' || p.unit === 'уп') return count;
  if (item.weighted && p.unit === 'г') return count * 1000;
  const fixed = p.unit === 'мл' ? PACK_ML[item.article] : PACK_GRAMS[item.article];
  if (fixed) return fixed * count;
  const m = String(item.name).match(/(\d+(?:[.,]\d+)?)\s*(kg|кг|g|г|l|л|ml|мл)\b/i);
  if (!m) return null;
  let n = Number(m[1].replace(',','.'));
  const u = m[2].toLowerCase();
  if (u === 'kg' || u === 'кг' || u === 'l' || u === 'л') n *= 1000;
  return n * count;
}

function receiptPlan(receipt){
  const mapped = [], unknown = [];
  for (const item of receipt.items || []){
    const p = purchaseProduct(item);
    const qty = p && purchaseQty(item, p);
    if (p && qty != null) mapped.push({product:p, qty:qty, source:item.name});
    else unknown.push(item.name);
  }
  return {receipt:receipt, mapped:mapped, unknown:unknown};
}

function groupedMapped(mapped){
  const out = new Map();
  for (const x of mapped){
    const old = out.get(x.product.id);
    if (old) old.qty += x.qty;
    else out.set(x.product.id, {product:x.product, qty:x.qty});
  }
  return [...out.values()];
}

async function syncLidl(btn){
  if (btn) btn.classList.add('spin');
  try {
    const res = await fetch(API + '/purchases?days=14', {credentials:'same-origin'});
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json(), ai = aiState();
    const fresh = (data.receipts || []).filter(function(r){ return ai.tickets.indexOf(r.id) < 0; });
    if (!fresh.length){ syncMessage = 'Всё актуально — новых чеков пока нет.'; syncDraft = null; render(); return; }
    syncMessage = '';
    syncDraft = fresh.map(function(r){ return Object.assign(receiptPlan(r), {included:true}); });
    render();
  } catch(e){ syncMessage = 'Не удалось получить покупки: ' + e.message; render(); }
  finally { if (btn) btn.classList.remove('spin'); }
}

function toggleReceipt(i, el){
  if (syncDraft && syncDraft[i]) syncDraft[i].included = el.checked;
  render();
}

function cancelSync(){ syncDraft = null; syncMessage = ''; render(); }

function applySync(){
  const picked = (syncDraft || []).filter(function(p){ return p.included; });
  if (!picked.length){ syncMessage = 'Выберите хотя бы один чек.'; render(); return; }
  const ai = aiState();
  const mapped = picked.reduce(function(a,p){ return a.concat(p.mapped); }, []);
  const grouped = groupedMapped(mapped);
  for (const x of grouped) addStock(x.product.id, x.qty);
  ai.tickets = ai.tickets.concat(picked.map(function(p){ return p.receipt.id; }));
  ai.purchases = ai.purchases.concat(picked.map(function(p){
    return {date:p.receipt.date, id:p.receipt.id, items:p.mapped.map(function(x){
      return {name:x.product.name, quantity:x.qty, unit:x.product.unit};
    })};
  })).slice(-6);
  ai.lastImport = {date:today(), receipts:picked.length, products:grouped.map(function(x){
    return {name:x.product.name, added:x.qty, unit:x.product.unit, total:stockLeft(x.product.id)};
  })};
  syncMessage = 'Готово: ' + grouped.length + ' продуктов добавлено в запасы.';
  syncDraft = null;
  save(); render();
}

function aiContext(){
  const p = currentPeriod(), day = dayFor(today()), ai = aiState();
  const stock = stockList().map(function(x){
    return {name:x.name, category:x.cat, unit:x.unit, left:stockLeft(x.id), days:daysLeft(x)};
  });
  return {
    date: today(),
    period: p ? {title:p.title, start:p.start, end:p.end || ''} : null,
    todayPlan: day ? {gym:day.gym || '', topic:day.topic || '', lunch:day.lunch || '', dinner:day.dinner || ''} : null,
    stockAvailable: stock.filter(function(x){ return x.left > 0; }),
    stockMissing: stock.filter(function(x){ return x.left <= 0; }).map(function(x){ return x.name; }),
    lastImport: ai.lastImport || null,
    recentPurchases: ai.purchases.slice(-3),
    recentJournal: entries().slice(-5).map(function(e){
      return {date:e.date, weight:e.w, sleep:e.sleep, mood:e.mood, note:e.note || ''};
    }),
    conversation: ai.messages.slice(-6)
  };
}

function usePrompt(text){
  const el = document.getElementById('ai-input');
  if (el){ el.value = text; el.focus(); }
}

function aiKey(event){
  if (event.key === 'Enter' && !event.shiftKey){
    event.preventDefault();
    if (!aiWaiting) askAI();
  }
}

async function askAI(){
  const input = document.getElementById('ai-input');
  const message = input && input.value.trim();
  if (!message) return;
  const ai = aiState();
  ai.messages.push({role:'user', text:message});
  aiWaiting = true; save(); render();
  try {
    const res = await fetch(API + '/chat', {
      method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:message, context:aiContext()})
    });
    const data = await res.json().catch(function(){ return {}; });
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
    ai.messages.push({role:'assistant', text:data.answer});
  } catch(e){ ai.messages.push({role:'assistant', text:'Не удалось ответить: ' + e.message}); }
  aiWaiting = false;
  ai.messages = ai.messages.slice(-20);
  save(); render();
}

function clearAI(){
  if (!confirm('Очистить историю диалога? Остатки и покупки останутся.')) return;
  aiState().messages = []; save(); render();
}

function viewAI(){
  const ai = aiState();
  const available = stockList().filter(function(x){ return stockLeft(x.id) > 0; });
  let lidl = '<details class="card purchase-panel' + (syncMessage.indexOf('Готово') === 0 ? ' success-card' : '') + '"' + (syncDraft ? ' open' : '') + '>' +
    '<summary><div class="sync-icon">✓</div><span><b>Покупки и запасы</b><small>' +
    (available.length ? plural(available.length,'позиция','позиции','позиций') + ' в наличии' : 'запасы пока не заполнены') +
    '</small></span></summary><div class="purchase-body">';
  if (syncMessage) lidl += '<div class="sync-note" style="margin-top:12px">' + esc(syncMessage) + '</div>';
  if (syncDraft){
    lidl += '<h3>Что добавить</h3>';
    syncDraft.forEach(function(plan, i){
      const grouped = groupedMapped(plan.mapped);
      lidl += '<div class="receipt"><label class="receipt-top"><input type="checkbox" ' + (plan.included ? 'checked ' : '') +
        'onchange="toggleReceipt(' + i + ',this)"><span class="receipt-title"><b>' + esc(human(plan.receipt.date)) + '</b><span>' +
        esc(plan.receipt.store || 'Lidl') + '</span></span><span class="receipt-count">' + grouped.length + '</span></label>';
      if (plan.included){
        lidl += '<ul class="import-list">' + grouped.map(function(x){ return '<li><span>' + esc(x.product.name) + '</span><b>+' +
          esc(fmtQty(x.qty, x.product.unit)) + '</b></li>'; }).join('') + '</ul>';
        if (plan.unknown.length) lidl += '<details><summary style="padding:9px 12px">Пропущено: ' + plan.unknown.length + '</summary><div class="small muted" style="padding:0 12px 10px">' +
          plan.unknown.map(esc).join(' · ') + '</div></details>';
      }
      lidl += '</div>';
    });
    lidl += '<div class="row2"><button class="btn" onclick="cancelSync()">Отмена</button><button class="btn acc" onclick="applySync()">Добавить в запасы</button></div>';
  } else {
    if (available.length){
      lidl += '<div class="stock-strip">' + available.slice(0,6).map(function(x){ return '<div class="stock-tile"><span>' + esc(x.name) +
        '</span><b>' + esc(fmtQty(stockLeft(x.id), x.unit)) + '</b></div>'; }).join('') + '</div>';
      if (available.length > 6) lidl += '<p class="hint">И ещё ' + (available.length - 6) + ' позиций в разделе «Кухня → Продукты».</p>';
    }
    lidl += '<button class="btn" onclick="syncLidl(this)">Найти новые чеки</button>';
  }
  lidl += '</div></details>';
  let h = '<div class="card chat-card"><div class="chat-top"><div class="chat-avatar">✦</div><div><b>Диалог</b><small>на связи</small></div></div><div class="chat" id="chat-thread">';
  if (!ai.messages.length) h += '<div class="msg ai">Привет, Саид. Я на связи.</div>';
  for (const m of ai.messages) h += '<div class="msg ' + (m.role === 'user' ? 'me' : 'ai') + '">' + esc(m.text) + '</div>';
  if (aiWaiting) h += '<div class="msg ai typing" aria-label="Ответ формируется"><i></i><i></i><i></i></div>';
  h += '</div><div class="chat-compose"><textarea id="ai-input" maxlength="2000" rows="1" placeholder="Сообщение…" onkeydown="aiKey(event)"></textarea>' +
    '<button class="chat-send' + (aiWaiting ? ' spin' : '') + '" id="ai-send" onclick="askAI()" aria-label="Отправить">↑</button></div>' +
    (ai.messages.length ? '<div class="chat-actions"><button onclick="clearAI()">Очистить историю</button></div>' : '') + '</div>';
  setTimeout(function(){ const box=document.getElementById('chat-thread'); if(box) box.scrollTop=box.scrollHeight; },0);
  return h + lidl;
}

function applyTheme(){
  const t = (S.ui || {}).theme || '';
  if (t) document.documentElement.setAttribute('data-th', t);
  else document.documentElement.removeAttribute('data-th');
  // строка состояния телефона должна совпадать с фоном приложения
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', getComputedStyle(document.body).backgroundColor);
}

function setNorm(el){
  if (!S.ui) S.ui = {};
  if (!S.ui.norm) S.ui.norm = {};
  const v = num(el.value);
  if (v == null || v <= 0) delete S.ui.norm[el.dataset.norm];
  else S.ui.norm[el.dataset.norm] = Math.round(v);
  save();
  render();
}

function resetNorm(){
  if (S.ui) delete S.ui.norm;
  save();
  render();
}

function setTheme(id){
  if (!S.ui) S.ui = {};
  S.ui.theme = id;
  save();
  applyTheme();
  render();
}

const REP = [1, 3, 7];                                            // возврат к теме: назавтра, через три дня, через неделю
const REP_LABEL = {1:'вчера', 3:'три дня назад', 7:'неделю назад'};

/* ─────────────── даты ─────────────── */

function iso(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function today(){ return iso(new Date()); }
function parse(s){ const p = String(s).split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function human(s){ const d = parse(s); return d.getDate() + ' ' + MON[d.getMonth()]; }
function humanFull(s){ const d = parse(s); return WD[d.getDay()] + ', ' + d.getDate() + ' ' + MON[d.getMonth()]; }
function shift(s, n){ const d = parse(s); d.setDate(d.getDate()+n); return iso(d); }
function diffDays(a, b){ return Math.round((parse(b) - parse(a)) / 86400000); }
function dowMon(s){ return (parse(s).getDay() + 6) % 7; }   // 0 = понедельник

/* ─────────────── хранилище ─────────────── */

function load(){
  try { const raw = localStorage.getItem(DKEY); if (raw) D = JSON.parse(raw); } catch(e){ D = null; }
  try { const raw = localStorage.getItem(SKEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch(e){ S = blank(); }
}
function save(){ try { localStorage.setItem(SKEY, JSON.stringify(S)); } catch(e){ alert('Не удалось сохранить: ' + e.message); } }
function saveData(){ try { localStorage.setItem(DKEY, JSON.stringify(D)); } catch(e){ alert('Не хватило места в памяти телефона.'); } }

async function refreshServerData(){
  try {
    const res = await fetch('plan16-data.json', {cache:'no-store'});
    if (!res.ok) return;
    const obj = await res.json();
    if (!obj.periods || !obj.docs) return;
    if (!D || JSON.stringify(D.stock) !== JSON.stringify(obj.stock) || D.generated !== obj.generated){
      D = obj; saveData(); render();
    }
  } catch(e){}
}

/* ─────────────── периоды и дни ─────────────── */

function periods(){
  const list = (D && D.periods ? D.periods.slice() : []).concat(S.periods || []);
  return list.sort(function(a,b){ return a.start < b.start ? -1 : a.start > b.start ? 1 : 0; });
}

function periodFor(day){
  const list = periods();
  let found = null;
  for (const p of list){
    if (p.start <= day && (!p.end || p.end >= day)) found = p;   // при наложении берём последний заведённый
  }
  return found;
}

function currentPeriod(){
  const p = periodFor(today());
  if (p) return p;
  const list = periods();
  if (!list.length) return null;
  // до старта — ближайший будущий, после конца — последний
  const future = list.filter(function(x){ return x.start > today(); });
  return future.length ? future[0] : list[list.length-1];
}

function dayFor(day){
  const p = periodFor(day);
  if (!p) return null;
  if (p.kind === 'weekly'){
    const w = (p.week || [])[dowMon(day)] || {};
    return {
      period: p, n: diffDays(p.start, day) + 1, date: day, weekday: WD[parse(day).getDay()],
      gym: w.gym || '', topic: w.topic || '', lunch: w.lunch || '', dinner: w.dinner || '',
      html: w.note ? '<p>' + esc(w.note).replace(/\n/g,'<br>') + '</p>' : ''
    };
  }
  const d = (p.days || []).find(function(x){ return x.date === day; });
  return d ? Object.assign({period:p}, d) : null;
}

/* ─────────────── возврат к темам ─────────────── */

function repKey(pid, title){ return pid + '|' + title; }

/* Что сегодня в возврате. Считается от дат, а не от номеров дней,
   поэтому работает и в недельном периоде, и на стыке двух периодов. */
function dueOn(day){
  const out = [];
  for (const gap of REP){
    const d = dayFor(shift(day, -gap));
    if (d && d.topic && d.study !== false){
      out.push({gap: gap, date: shift(day, -gap), title: d.topic, key: repKey(d.period.id, d.topic)});
    }
  }
  return out;
}

function repDone(key, gap){ return !!(S.rep[key] || {})[gap]; }

function topicState(title, pid, date){
  const r = S.rep[repKey(pid, title)] || {};
  const done = REP.filter(function(g){ return r[g]; }).length;
  if (r.closed || done >= REP.length) return {t: 'закрыта', c: ' b'};
  if (date && date > today()) return {t: 'впереди', c: ''};
  if (date && date === today()) return {t: 'сегодня', c: ''};
  return {t: 'возвратов ' + done + ' из ' + REP.length, c: ''};
}

function toggleTopic(key){
  const r = S.rep[key] || (S.rep[key] = {});
  if (r.closed) delete r.closed; else r.closed = 1;
  save();
  render();
}

/* ─────────────── мелочи ─────────────── */

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}
/* Принимает и «7,5», и «7:30», и «7ч30» — сон удобнее вводить в часах и минутах. */
function num(v){
  const s = String(v).trim();
  const hm = s.match(/^(\d+)\s*[:чh]\s*(\d{1,2})/i);
  if (hm) return +hm[1] + (+hm[2]) / 60;
  const n = parseFloat(s.replace(',', '.'));
  return isFinite(n) ? n : null;
}

/* 7,5 → «7 ч 30 мин» */
function hm(v){
  if (v == null) return '—';
  const h = Math.floor(v), m = Math.round((v - h) * 60);
  return h + ' ч' + (m ? ' ' + m + ' мин' : '');
}
function fmt(n, d){ return n == null ? '—' : n.toFixed(d == null ? 1 : d).replace('.', ','); }
function plural(n, one, few, many){
  const a = Math.abs(n) % 100, b = a % 10;
  return n + ' ' + (a > 10 && a < 20 ? many : b === 1 ? one : b > 1 && b < 5 ? few : many);
}

const ALIAS = {'рататуй':'ratatouille','омлет':'omelette','лосось':'saumon','креветк':'crevettes',
  'чечевиц':'lentilles','курица':'poulet','курицу':'poulet','салат':'salade','яйц':'oeufs'};

function norm(s){
  let t = String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  for (const k in ALIAS) if (t.indexOf(k) >= 0) t += ' ' + ALIAS[k];
  return ' ' + t.replace(/[^a-zа-яё0-9]+/gi,' ').trim() + ' ';
}

function findRecipe(text){
  if (!D || !D.recipes || !text) return null;
  const t = norm(text);
  let best = null, bestLen = 0;
  for (const r of D.recipes){
    for (const w of norm(r.title).trim().split(' ')){
      if (w.length >= 5 && t.indexOf(' ' + w) >= 0 && w.length > bestLen){ best = r; bestLen = w.length; }
    }
  }
  return best;
}

/* ─────────────── вкладка «Сегодня» ─────────────── */

function viewToday(){
  if (!D) return viewEmpty();
  const day = today();
  const d = dayFor(day);
  const p = d ? d.period : currentPeriod();

  if (!d){
    const gap = p && p.start > day
      ? 'Период «' + esc(p.title) + '» начинается ' + human(p.start) + '.'
      : (p ? 'Период «' + esc(p.title) + '» закончился ' + human(p.end || p.start) + '.' : '');
    return '<div class="card"><h2>На сегодня плана нет</h2><p class="muted small">' + gap +
      ' Заведи новый режим в «Ещё» — записи и кухня останутся.</p>' +
      '<button class="btn acc" onclick="go(\'more\')">Открыть настройки</button></div>' + logForm(day, null);
  }

  const rows = dayRows(d, day);
  let h = summaryCard(d, day, rows);
  for (const z of ZONES) h += zoneCard(z, day, rows);
  return h;
}

/* ─────────────── строки дня ─────────────── */

const ZONES = [
  {id: 'body',   title: 'Тело',        icon: '◍', hue: '#7b8cf0'},
  {id: 'food',   title: 'Еда',         icon: '◑', hue: 'var(--a1)'},
  {id: 'study',  title: 'Учёба',       icon: '▤', hue: 'var(--a2)'},
  {id: 'regime', title: 'Ещё за день', icon: '◇', hue: 'var(--muted)'}
];

/* Один список дел на день, разложенный по смыслу.
   Расписание даёт время, состав приёмов — еду, программа курса — учёбу. */
function dayRows(d, day){
  const rows = [];
  const e = S.log[day] || {};
  const sched = d.period.schedule || [];
  const at = function(re){ const s = sched.find(function(x){ return re.test(strip(x.s)); }); return s ? s.t : ''; };

  // ── тело
  rows.push({zone:'body', key:'weigh', t: at(/Вес|Подъём/) || '06:30',
    text: 'Взвеситься и записать',
    sub: e.w != null ? fmt(e.w) + ' кг' : 'вес не записан',
    detail: function(){ return logFields(day); }});

  if (d.gym && !/^нет/i.test(d.gym)){
    rows.push({zone:'body', key:'gym', t: at(/Зал:/) || '',
      text: 'Зал: ' + d.gym, sub: '', detail: null});
  }
  const walk = sched.filter(function(x){ return /пешк|прогулк/i.test(strip(x.s)); });
  if (walk.length){
    rows.push({zone:'body', key:'walk', t: walk[0].t,
      text: walk.length > 1 ? 'Прогулка 6 км: в зал и обратно' : strip(walk[0].s),
      sub: '', detail: null});
  }

  // ── еда
  const N = nut();
  // закуп не стоит в расписании: он появляется в дне, только когда сам его добавил
  const trip = ((D && D.shopping) || []).find(function(x){ return x.id === e.trip; });
  if (trip){
    rows.push({zone:'food', key:'shopped', tick:'shopped', t:'',
      text: 'Закуп: ' + trip.title, sub: plural(trip.items.length, 'позиция', 'позиции', 'позиций'),
      detail: function(){ return '<div class="md">' + trip.html + '</div>'; }});
  }
  if (N) N.meals.forEach(function(meal, i){
    const idx = i + 1;
    const dish = mealDish(day, idx, d);
    const t = mealTotal(meal, day, dish);
    rows.push({zone:'food', key:'meal' + idx, tick:'meal', mealIdx: idx,
      t: at(new RegExp('Приём\\s*' + idx)) || '',
      text: meal.title + (dish ? ' — ' + dish.title : ''),
      sub: Math.round(t.p) + ' г белка · ' + Math.round(t.kcal) + ' ккал',
      detail: function(){ return mealDetail(meal, idx, day, d); }});
  });

  // ── учёба
  for (const x of dueOn(day)){
    rows.push({zone:'study', key:'rep|' + x.key + '|' + x.gap, tick:'rep', rep: x,
      t: '', text: 'Возврат: ' + x.title, sub: REP_LABEL[x.gap],
      detail: function(){ return repDetail(x); }});
  }
  const theme = themeOf(d);
  if (theme){
    rows.push({zone:'study', key:'study', t: at(/Учебн/) || '10:45',
      text: 'Учебный блок — ' + theme.title,
      sub: theme.modules.map(function(m){ return m.code; }).join(' · '),
      detail: function(){ return themeDetail(theme); }});
    if (theme.modules.some(function(m){ return m.frPoints && m.frPoints.length; })){
      rows.push({zone:'study', key:'fr', t: at(/Французск/) || '19:30',
        text: 'Французский на диктофон', sub: 'час, по разделам темы',
        detail: function(){ return frDetail(theme); }});
    }
  }

  // ── остальное из чек-листа периода
  ((d.period.checklist) || []).forEach(function(item, i){
    rows.push({zone:'regime', key:'c' + i, tick:'check', checkIdx: i, t:'', text: item, sub:'', detail: null});
  });

  return rows;
}

function strip(s){ return String(s || '').replace(/<[^>]+>/g, ''); }

function rowDone(day, row){
  const e = S.log[day] || {};
  if (row.tick === 'meal') return !!(e.meals || {})[row.mealIdx];
  if (row.tick === 'shopped') return !!e.shopped;
  if (row.tick === 'check') return e.pid === (periodFor(day) || {}).id && !!(e.check || {})[row.checkIdx];
  if (row.tick === 'rep') return repDone(row.rep.key, row.rep.gap);
  return !!(e.done || {})[row.key];
}

function rowInput(day, row){
  const on = rowDone(day, row) ? ' checked' : '';
  if (row.tick === 'meal') return '<input type="checkbox" data-meal="' + row.mealIdx + '"' + on + '>';
  if (row.tick === 'shopped') return '<input type="checkbox" data-shopped' + on + '>';
  if (row.tick === 'check') return '<input type="checkbox" data-check="' + row.checkIdx + '"' + on + '>';
  if (row.tick === 'rep') return '<input type="checkbox" data-rep="' + esc(row.rep.key) + '" data-gap="' + row.rep.gap + '"' + on + '>';
  return '<input type="checkbox" data-done="' + esc(row.key) + '"' + on + '>';
}

function zoneCard(zone, day, rows){
  // внутри блока — по времени; строки без времени идут после
  const mine = rows.filter(function(r){ return r.zone === zone.id; })
    .sort(function(a, b){ return (a.t || '99:99').localeCompare(b.t || '99:99'); });
  if (!mine.length) return '';
  const done = mine.filter(function(r){ return rowDone(day, r); }).length;

  let h = '<div class="card"><div class="zone-h">' +
    '<i style="background:color-mix(in srgb,' + zone.hue + ' 18%,transparent); color:' + zone.hue + '">' + zone.icon + '</i>' +
    '<h2>' + esc(zone.title) + '</h2>' +
    '<span class="muted small">' + done + ' из ' + mine.length + '</span></div><ul class="tl">';
  for (const r of mine){
    const open = openRow === r.key;
    h += '<li><div class="row">' +
      (r.t ? '<span class="t">' + esc(r.t) + '</span>' : '<span class="t"></span>') +
      '<label>' + rowInput(day, r) + '<span class="txt">' + esc(r.text) +
      (r.sub ? '<small class="muted"> · ' + esc(r.sub) + '</small>' : '') + '</span></label></div>';
    if (r.detail){
      h += '<button class="more" onclick="toggleRow(\'' + esc(r.key).replace(/'/g, "\\'") + '\')">' +
        (open ? 'свернуть' : 'подробнее') + '</button>';
      if (open) h += '<div class="detail">' + r.detail() + '</div>';
    }
    h += '</li>';
  }
  if (zone.id === 'food') h += extrasRow(day) + waterRow(day) + tripRow(day);
  h += '</ul>';
  if (zone.id === 'food') h += proteinNote(day);
  return h + '</div>';
}

function toggleRow(key){ openRow = openRow === key ? null : key; render(); }

const FOOD_CATALOG = [
  {id:'banana', name:'Банан', unit:'г', p:1.1, f:.3, c:22.8, kcal:89},
  {id:'apple', name:'Яблоко', unit:'г', p:.3, f:.2, c:13.8, kcal:52},
  {id:'orange', name:'Апельсин', unit:'г', p:.9, f:.1, c:11.8, kcal:47},
  {id:'fruit', name:'Другой фрукт (среднее)', unit:'г', p:.7, f:.2, c:13, kcal:55},
  {id:'bread', name:'Хлеб цельнозерновой', unit:'г', p:9, f:3.5, c:43, kcal:250},
  {id:'protein_bar', name:'Протеиновый батончик', unit:'г', p:30, f:12, c:35, kcal:370}
];

function foodById(id){ return FOOD_CATALOG.find(function(x){ return x.id === id; }); }

function addFood(day){
  const pick = document.getElementById('food-kind');
  const amount = document.getElementById('food-amount');
  const food = pick && foodById(pick.value);
  const grams = amount ? Number(String(amount.value).replace(',','.')) : 0;
  if (!food || !grams || grams <= 0) return;
  const e = S.log[day] || (S.log[day] = {});
  if (!e.food) e.food = [];
  e.food.push({id:food.id, grams:Math.round(grams * 10) / 10});
  save(); render();
}

function removeFood(day, idx){
  const e = S.log[day] || {};
  if (!e.food) return;
  e.food.splice(idx, 1);
  if (!e.food.length) delete e.food;
  save(); render();
}

function extrasRow(day){
  const N = nut();
  if (!N || !N.extras) return '';
  const e = S.log[day] || {};
  const got = eaten(day), n = norms();
  const left = {p: n.p - got.p, c: n.c - got.c, kcal: n.kcal - got.kcal};
  const chosen = e.extra || {};

  // у калорий и углеводов плох перебор, у белка — недобор; красить одинаково нельзя
  const cap = function(v, unit){
    return v >= 0
      ? '<b>' + Math.round(v) + '</b> ' + unit
      : '<b style="color:var(--warn)">+' + Math.round(-v) + '</b> ' + unit + ' сверх';
  };
  const floorP = left.p > 0
    ? '<b>' + Math.round(left.p) + '</b> г белка'
    : '<b style="color:var(--a2)">белок закрыт</b>';

  let h = '<li><div class="row"><span class="t"></span><span class="txt">' +
    '<span class="muted small">Осталось на сегодня</span><br>' +
    cap(left.kcal, 'ккал') + ' · ' + cap(left.c, 'г углеводов') + ' · ' + floorP +
    '<br><button class="more" style="padding-left:0" onclick="toggleRow(\'extras\')">' +
    (openRow === 'extras' ? 'свернуть' : 'добавить что-то ещё') + '</button></span></div>';

  if (openRow === 'extras'){
    h += '<div class="detail" style="padding-left:0"><ul class="parts">';
    for (const x of N.extras){
      const cnt = chosen[x.id] || 0;
      h += '<li style="display:flex; align-items:center; gap:8px">' +
        '<span style="flex:1">' + esc(x.name) + '<br><span class="muted small">' +
        x.kcal + ' ккал · ' + x.p + ' г белка · ' + x.c + ' г углеводов</span></span>' +
        (cnt ? '<button class="step" data-extra="' + x.id + '" data-d="-1">−</button>' +
               '<b style="min-width:14px; text-align:center">' + cnt + '</b>' : '') +
        '<button class="step" data-extra="' + x.id + '" data-d="1">+</button></li>';
    }
    h += '</ul><div class="food-add"><select id="food-kind">' + FOOD_CATALOG.map(function(x){
      return '<option value="' + x.id + '">' + esc(x.name) + ' · ' + x.kcal + ' ккал/100 г</option>';
    }).join('') + '</select><input id="food-amount" type="number" min="1" step="1" inputmode="decimal" placeholder="граммы">' +
      '<button class="step" onclick="addFood(\'' + day + '\')">Добавить</button></div>';
    const foods = e.food || [];
    if (foods.length){
      h += '<ul class="food-log">' + foods.map(function(x,i){
        const f = foodById(x.id); if (!f) return '';
        return '<li><span>' + esc(f.name) + '<small>' + fmt(x.grams) + ' г · ' + Math.round(f.kcal * x.grams / 100) + ' ккал</small></span>' +
          '<button class="step" onclick="removeFood(\'' + day + '\',' + i + ')">убрать</button></li>';
      }).join('') + '</ul>';
    }
    h += '</div>';
  }
  return h + '</li>';
}

function tripRow(day){
  const trips = (D && D.shopping) || [];
  if (!trips.length) return '';
  const e = S.log[day] || {};

  if (e.trip){
    return '<li><div class="row"><span class="t"></span><span class="txt muted small">' +
      'Закуп добавлен в этот день <button class="step" data-trip="">убрать</button></span></div></li>';
  }
  let h = '<li><div class="row"><span class="t"></span><span class="txt"><span class="muted small">Иду в магазин:</span><br>';
  for (const t of trips){
    h += '<button class="step" style="margin:6px 6px 0 0" data-trip="' + esc(t.id) + '">+ ' + esc(t.title) + '</button>';
  }
  return h + '</span></div></li>';
}

function waterRow(day){
  const v = (S.log[day] || {}).water || 0;
  return '<li><div class="row"><span class="t"></span><span class="txt" style="display:flex;align-items:center;gap:10px">' +
    '<span>Вода <b>' + fmt(v) + '</b> л</span>' +
    '<button class="step" data-water="-0.5">−</button><button class="step" data-water="0.5">+ 0,5 л</button>' +
    '</span></div></li>';
}

/* ─────────────── сводка дня ─────────────── */

function summaryCard(d, day, rows){
  const N = nut();
  const done = rows.filter(function(r){ return rowDone(day, r); }).length;
  const pct = rows.length ? done / rows.length : 0;
  const R = 27, C = 2 * Math.PI * R;

  let h = '<div class="card">';
  h += '<div class="day-head"><span class="n">День ' + d.n + '</span><span class="muted small">' +
    esc(humanFull(day)) + (d.period.days ? ' · из ' + d.period.days.length : '') + '</span></div>';

  h += '<div class="ring">' +
    '<svg width="66" height="66" viewBox="0 0 66 66" aria-hidden="true">' +
    '<circle cx="33" cy="33" r="' + R + '" fill="none" stroke="var(--line)" stroke-width="7"></circle>' +
    '<circle cx="33" cy="33" r="' + R + '" fill="none" stroke="var(--a2)" stroke-width="7" stroke-linecap="round"' +
    ' stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + (C * (1 - pct)).toFixed(1) +
    '" transform="rotate(-90 33 33)"></circle></svg>' +
    '<div><div class="n">' + done + ' из ' + rows.length + '</div>' +
    '<div class="muted small">дел закрыто</div></div></div>';

  if (N){
    const s = eaten(day), n = norms();
    h += '<div class="pills">' +
      pill(Math.round(s.p), 'белок / ' + n.p) +
      pill(Math.round(s.kcal), 'ккал / ' + n.kcal) +
      pill(fmt((S.log[day] || {}).water || 0), 'вода / 4 л') +
      '</div>';
  }
  return h + '</div>';
}

function pill(value, label){
  return '<div class="pill"><b>' + value + '</b><span>' + esc(label) + '</span></div>';
}

/* ─────────────── гарнир ─────────────── */

function range(text){
  const m = String(text || '').match(/(\d+)(?:\s*[–—-]\s*(\d+))?/);
  return m ? [+m[1], m[2] ? +m[2] : +m[1]] : null;
}

function nut(){ return D && D.nutrition && D.nutrition.meals ? D.nutrition : null; }

function chosenSide(day){
  const N = nut();
  if (!N || !N.sides || !N.sides.length) return null;
  const e = S.log[day] || {};
  return N.sides.find(function(s){ return s.name === e.side; }) || N.sides[0];
}

/* Вес гарнира под ту же энергию, что у гарнира по плану. */
function sideGrams(sel){
  const N = nut();
  return Math.round(N.side.kcal / sel.kcal * 100);
}

function isSideMeal(meal){
  const N = nut();
  return !!(N && N.side && N.side.meal === meal.title);
}

/* Блюдо приёма: выбранное вручную, иначе то, что стоит в плане дня. */
function mealDish(day, idx, d){
  const e = S.log[day] || {};
  const picked = (e.dish || {})[idx];
  if (picked && D.recipes){
    const r = D.recipes.find(function(x){ return x.id === picked; });
    if (r) return r;
  }
  return findRecipe(idx === 1 ? d.lunch : d.dinner);
}

/* Блюда, которые предлагаются для приёма: обеды к первому, ужины ко второму. */
function dishChoices(idx){
  if (!D || !D.recipes) return [];
  const want = idx === 1 ? /обед/i : /ужин/i;
  const list = D.recipes.filter(function(r){ return want.test(r.group); });
  return list.length ? list : D.recipes;
}

function saladChoices(){
  if (!D || !D.recipes) return [];
  return D.recipes.filter(function(r){ return /салат/i.test(r.group); });
}

/* Откуда берётся главный овощ салата — чтобы не выбирать то, чего дома нет. */
function saladSource(salad){
  const main = salad.main.charAt(0).toUpperCase() + salad.main.slice(1);
  const trips = (salad.trips || []).map(function(id){
    const t = (D.shopping || []).find(function(x){ return x.id === id; });
    return t ? t.title.toLowerCase() : id;
  });
  return trips.length
    ? main + ' — в списке «' + trips.join('», «') + '»'
    : main + ' в закуп не входит, докупать отдельно';
}

function mealSalad(day, idx){
  const picked = ((S.log[day] || {}).salad || {})[idx];
  return picked && D.recipes ? D.recipes.find(function(x){ return x.id === picked; }) : null;
}

/* Итог приёма с учётом выбранного гарнира. */
function mealTotal(meal, day){
  const N = nut();
  const t = meal.total || {p:0, f:0, c:0, kcal:0};
  const out = {p: t.p, f: t.f, c: t.c, kcal: t.kcal};
  const sel = chosenSide(day);
  if (isSideMeal(meal) && sel && sel.name !== N.side.name){
    const g = sideGrams(sel);
    out.p += sel.p * g / 100 - N.side.p;
    out.f += sel.f * g / 100 - N.side.f;
    out.c += sel.c * g / 100 - N.side.c;
    out.kcal += sel.kcal * g / 100 - N.side.kcal;
  }
  return out;
}

/* Съедено за день: отмеченные приёмы плюс добавки. План здесь ни при чём. */
function eaten(day){
  const N = nut();
  const e = S.log[day] || {};
  const done = e.meals || {};
  const sum = {p:0, f:0, c:0, kcal:0};
  if (!N) return sum;

  N.meals.forEach(function(m, i){
    if (!done[i + 1]) return;
    const t = mealTotal(m, day);
    sum.p += t.p; sum.f += t.f; sum.c += t.c; sum.kcal += t.kcal;
  });

  const extras = e.extra || {};
  for (const x of (N.extras || [])){
    const n = extras[x.id] || 0;
    sum.p += x.p * n; sum.f += x.f * n; sum.c += x.c * n; sum.kcal += x.kcal * n;
  }
  for (const x of (e.food || [])){
    const food = foodById(x.id);
    if (!food) continue;
    const k = x.grams / 100;
    sum.p += food.p * k; sum.f += food.f * k; sum.c += food.c * k; sum.kcal += food.kcal * k;
  }
  return sum;
}

/* Дневная норма: своя, если задана в настройках, иначе из плана. */
function norms(){
  const N = nut();
  const my = (S.ui || {}).norm || {};
  const p = range(N ? N.norm.p : ''), c = range(N ? N.norm.c : ''), k = range(N ? N.norm.kcal : '');
  return {
    p: my.p != null ? my.p : (p ? p[0] : 200),
    c: my.c != null ? my.c : (c ? c[1] : 105),
    kcal: my.kcal != null ? my.kcal : (k ? k[1] : 2150)
  };
}

function mealDetail(meal, idx, day, d){
  const N = nut();
  const sel = chosenSide(day);
  const swap = isSideMeal(meal) && sel;
  const g = swap ? sideGrams(sel) : 0;
  const dish = mealDish(day, idx, d);
  const choices = dishChoices(idx);

  let h = '';
  if (choices.length){
    h += '<div class="f"><label>Блюдо</label><select data-dish="' + idx + '">';
    for (const r of choices){
      h += '<option value="' + esc(r.id) + '"' + (dish && r.id === dish.id ? ' selected' : '') + '>' +
        esc(r.title) + '</option>';
    }
    h += '</select></div>';
  }
  if (swap){
    h += '<div class="f" style="margin-top:8px"><label>Гарнир</label><select data-side>';
    for (const s of N.sides){
      h += '<option value="' + esc(s.name) + '"' + (s.name === sel.name ? ' selected' : '') + '>' +
        esc(s.name) + ' — ' + esc(s.ru) + (s.name === N.side.name ? ' · по плану' : '') + '</option>';
    }
    h += '</select></div>';
  }

  const salads = saladChoices();
  const salad = mealSalad(day, idx);
  if (salads.length){
    h += '<div class="f" style="margin-top:8px"><label>Салат</label><select data-salad="' + idx + '">';
    h += '<option value=""' + (salad ? '' : ' selected') + '>Без салата</option>';
    for (const r of salads){
      h += '<option value="' + esc(r.id) + '"' + (salad && r.id === salad.id ? ' selected' : '') + '>' +
        esc(r.title) + (r.main ? ' · ' + esc(r.main) : '') + '</option>';
    }
    h += '</select>';
    if (salad && salad.main) h += '<div class="hint">' + saladSource(salad) + '</div>';
    h += '</div>';
  }
  // из чего приём состоит целиком — иначе кажется, что ешь одну курицу с чечевицей
  const inDish = meal.items.filter(function(it){
    return !(swap && it.name === N.side.name) && !/fromage blanc/i.test(it.name);
  });
  const final = meal.items.find(function(it){ return /fromage blanc/i.test(it.name); });

  h += '<ul class="parts">';
  h += '<li><b>Блюдо</b> — ' + inDish.map(function(it){
    return it.name.toLowerCase() + ' ' + it.weight;
  }).join(', ') + '</li>';
  if (swap) h += '<li><b>Гарнир</b> — ' + esc(sel.name.toLowerCase()) + ' ' + g + ' г</li>';
  h += '<li><b>Салат</b> — ' + (salad ? esc(salad.title) : 'не выбран, по желанию') + '</li>';
  if (final) h += '<li><b>Финал</b> — ' + esc(final.name.toLowerCase()) + ' ' + esc(final.weight) + ', обязательно</li>';
  h += '</ul>';

  if (dish){
    h += '<button class="btn" style="margin-top:10px" onclick="openR(\'' + esc(dish.id).replace(/'/g, "\\'") +
      '\')">Рецепт: ' + esc(dish.title) + ' →</button>';
  }
  // ссылка на салаты есть всегда: иначе рецепт не посмотреть, не выбрав вслепую
  h += salad
    ? '<button class="btn" style="margin-top:8px" onclick="openR(\'' + esc(salad.id).replace(/'/g, "\\'") +
      '\')">Рецепт: ' + esc(salad.title) + ' →</button>'
    : '<button class="btn" style="margin-top:8px" onclick="openD(\'salades\')">Посмотреть все салаты →</button>';
  if (salad){
    h += '<p class="hint">Салат в цифры приёма не входит. С низкокалорийным соусом это примерно 60–110 ккал ' +
      'и почти без жиров; с классическим винегретом — на 280 ккал больше, и тогда убирай ложку масла из блюда.</p>';
  }

  h += '<details style="margin-top:10px"><summary>Состав и цифры</summary>';
  h += '<div class="md"><table><tr><th>Что</th><th>Вес</th><th>Б</th><th>Ж</th><th>У</th><th>Ккал</th></tr>';
  for (const it of meal.items){
    const mine = swap && it.name === N.side.name;
    const row = mine
      ? {name: sel.name, weight: g + ' г', p: sel.p * g / 100, f: sel.f * g / 100, c: sel.c * g / 100, kcal: sel.kcal * g / 100}
      : it;
    h += '<tr><td>' + esc(row.name) + '</td><td>' + esc(row.weight) + '</td><td>' +
      Math.round(row.p) + '</td><td>' + Math.round(row.f) + '</td><td>' +
      Math.round(row.c) + '</td><td>' + Math.round(row.kcal) + '</td></tr>';
  }
  const t = mealTotal(meal, day);
  h += '<tr><td><b>Итого</b></td><td></td><td><b>' + Math.round(t.p) + '</b></td><td><b>' +
    Math.round(t.f) + '</b></td><td><b>' + Math.round(t.c) + '</b></td><td><b>' +
    Math.round(t.kcal) + '</b></td></tr></table></div></details>';
  return h;
}

/* Подсказка появляется только когда съедены оба приёма — раньше она бессмысленна. */
function proteinNote(day){
  const N = nut();
  if (!N) return '';
  const s = eaten(day);
  const np = range(N.norm.p);
  const done = (S.log[day] || {}).meals || {};
  const count = N.meals.filter(function(_, i){ return done[i + 1]; }).length;
  if (count !== N.meals.length || !np || s.p >= np[0] - 5) return '';

  const need = Math.round(np[0] - s.p);
  const list = (N.proteinFix || []).slice().sort(function(a, b){ return a.kcal - b.kcal; });
  const fit = list.filter(function(f){ return f.p >= need; });
  const pick = (fit.length ? fit : list.slice(-1)).slice(0, 2);
  return '<div class="note">Оба приёма съедены, а белка не хватает ' + need + ' г. Добери: ' +
    pick.map(function(f){ return f.what + ' — ' + f.p + ' г, ' + f.kcal + ' ккал'; }).join(' или ') + '.</div>';
}

function themeOf(d){
  return d && d.theme && D && D.curriculum ? D.curriculum[d.theme - 1] : null;
}

function points(list){
  return '<ul>' + list.map(function(p){ return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>';
}

function themeDetail(t){
  let h = '<p class="small muted">Прочитал заметку в Obsidian, закрыл, рассказал вслух по пунктам. Что не вспомнилось — открыл и отметил красным.</p>';
  for (const m of t.modules){
    h += '<details><summary>' + esc(m.code) + ' · ' + esc(m.title) + '</summary><div class="md">' +
      '<p class="muted small">' + esc(m.note) + '</p>' + points(m.points) + '</div></details>';
  }
  return h;
}

function frDetail(t){
  const mods = t.modules.filter(function(m){ return m.frPoints && m.frPoints.length; });
  if (!mods.length) return '';
  let h = '<p class="small muted">Час на диктофон, по разделам той же темы. Потом прослушать и отметить, где сбивался на русский.</p>';
  for (const m of mods){
    h += '<details><summary>' + esc(m.fr || m.code) + '</summary><div class="md">' + points(m.frPoints) + '</div></details>';
  }
  return h;
}

function repDetail(x){
  const d = dayFor(x.date);
  const t = d ? themeOf(d) : null;
  let h = '<p class="small muted">Конспект закрыт, рассказываешь вслух. Что не вспомнилось — открыл и отметил.</p>';
  if (t) for (const m of t.modules) h += '<details><summary>' + esc(m.code) + '</summary><div class="md">' + points(m.points) + '</div></details>';
  return h;
}

function logForm(day, p){
  return '<div class="card"><h2>Запись за ' + human(day) + '</h2>' + logFields(day) + '</div>';
}

function logFields(day){
  const e = S.log[day] || {};
  let h = '<div class="grid">';
  h += field('w', 'Вес, кг', e.w, 'decimal');
  h += field('sleep', 'Сон, ч', e.sleep, 'decimal');
  h += field('mood', 'Самочувствие 1–5', e.mood, 'numeric');
  h += field('neck', 'Шея, см', e.neck, 'decimal');
  h += field('waist', 'Талия, см', e.waist, 'decimal');
  h += '</div>';
  h += '<div class="f" style="margin-top:10px"><label>Заметка</label>' +
       '<textarea data-log="note" style="min-height:64px">' + esc(e.note || '') + '</textarea></div>';
  h += '<div class="saved" id="saved"></div>';
  return h;
}

function field(k, label, v, mode){
  return '<div class="f"><label>' + label + '</label>' +
    '<input type="text" inputmode="' + mode + '" data-log="' + k + '" value="' + (v == null ? '' : esc(String(v).replace('.',','))) + '"></div>';
}

function viewEmpty(){
  return '<div class="empty"><p>Здесь появится твой день, когда загрузишь файл с планом.</p>' +
    '<button class="btn acc" onclick="pick()">Загрузить файл</button>' +
    '<p class="hint">«Файлы» → iCloud Drive → План → plan16-data.json</p></div>';
}

/* ─────────────── вкладка «План» ─────────────── */

function viewPlan(){
  if (!D) return viewEmpty();
  const p = currentPeriod();
  if (!p) return '<div class="card"><p class="muted">Ни одного периода не заведено.</p></div>';
  let h = '';

  if (p.kind === 'weekly'){
    h += '<div class="card tight"><ul class="list">';
    (p.week || []).forEach(function(w, i){
      const cur = dowMon(today()) === i;
      h += '<li' + (cur ? ' class="now"' : '') + '><button><span class="k">' + WD_SHORT[i] + '</span>' +
        '<span class="v">' + esc(w.gym || '—') + (w.topic ? '<small>' + esc(w.topic) + '</small>' : '') + '</span></button></li>';
    });
    h += '</ul></div>';
  } else {
    h += '<div class="card tight"><ul class="list">';
    for (const d of (p.days || [])){
      const cur = d.date === today();
      const on = openDay === d.n;
      h += '<li' + (cur ? ' class="now"' : '') + '>';
      h += '<button onclick="toggleDay(' + d.n + ')"><span class="k">' + d.n + ' · ' + human(d.date).replace(/ .*/,'.' + String(parse(d.date).getMonth()+1).padStart(2,'0')) + '</span>' +
        '<span class="v">' + esc(d.topic || '—') + '<small>' + esc(d.gym || '') +
        (d.lunch ? ' · ' + esc(d.lunch) : '') + '</small></span></button>';
      if (on) h += '<div class="md" style="padding:0 16px 14px">' + d.html + '</div>';
      h += '</li>';
    }
    h += '</ul></div>';
  }

  h += topicsCard(p);
  if (p.skeletonHtml) h += '<div class="card"><h2>Скелет дня</h2><div class="md">' + p.skeletonHtml + '</div></div>';
  for (const x of (p.extras || [])) h += '<div class="card"><h2>' + esc(x.title) + '</h2><div class="md">' + x.html + '</div></div>';
  return h;
}

function toggleDay(n){ openDay = openDay === n ? null : n; render(); }

function topicsCard(p){
  const items = [];
  if (p.kind === 'weekly'){
    (p.week || []).forEach(function(w, i){ if (w.topic) items.push({title: w.topic, when: WD_SHORT[i], date: ''}); });
  } else {
    for (const d of (p.days || [])){
      if (!d.topic || d.study === false) continue;
      const t = themeOf(d);
      items.push({
        title: d.topic, when: human(d.date), date: d.date,
        sub: t ? t.modules.map(function(m){ return m.code; }).join(' · ') : ''
      });
    }
  }
  if (!items.length) return '';

  const closed = items.filter(function(x){ return topicState(x.title, p.id, x.date).t === 'закрыта'; }).length;
  let h = '<div class="card"><h2>Программа <span class="muted small">' + closed + ' из ' + items.length + ' закрыто</span></h2>' +
    '<p class="small muted">Темы идут в том же порядке, что на курсах. Экзамены, проект, английский и мастерская CV в повторение не входят. ' +
    'Возвраты отмечаются на вкладке «Сегодня»: назавтра, через три дня, через неделю. Три отметки закрывают тему сами, нажатие на строку — вручную.</p></div>';
  h += '<div class="card tight"><ul class="list">';
  for (const x of items){
    const st = topicState(x.title, p.id, x.date);
    h += '<li' + (x.date === today() ? ' class="now"' : '') + '>' +
      '<button onclick="toggleTopic(\'' + esc(repKey(p.id, x.title)).replace(/'/g, "\\'") + '\')">' +
      '<span class="k">' + esc(x.when) + '</span>' +
      '<span class="v">' + esc(x.title) + (x.sub ? '<small>' + esc(x.sub) + '</small>' : '') + '</span>' +
      '<span class="chip' + st.c + '">' + st.t + '</span></button></li>';
  }
  return h + '</ul></div>';
}

function foodCategory(r){
  const g = String(r.group || '').toLowerCase();
  if (g.indexOf('обед') === 0) return 'lunch';
  if (g.indexOf('ужин') === 0) return 'dinner';
  if (g.indexOf('салат') >= 0) return 'salad';
  return 'sauce';
}
function foodCategoryName(id){ return ({all:'Все рецепты',lunch:'Обеды',dinner:'Ужины',salad:'Салаты',sauce:'Соусы и база'})[id] || 'Рецепт'; }
function setFoodFilter(id){ foodFilter=id; foodQuery=''; render(); }
function foodSearch(el){
  foodQuery=el.value || '';
  const q=foodQuery.trim().toLowerCase(); let shown=0;
  document.querySelectorAll('.recipe-card').forEach(function(card){
    const yes=!q || String(card.dataset.food || '').indexOf(q)>=0; card.style.display=yes?'':'none'; if(yes) shown++;
  });
  document.querySelectorAll('.recipe-section').forEach(function(section){
    const visible=[...section.querySelectorAll('.recipe-card')].some(function(card){ return card.style.display!=='none'; });
    section.style.display=visible?'':'none';
  });
  const count=document.getElementById('food-count'); if(count) count.textContent=plural(shown,'рецепт','рецепта','рецептов');
  const empty=document.getElementById('kitchen-empty'); if(empty) empty.style.display=shown?'none':'block';
}
function kitchenLink(id,icon,title,sub){
  return '<button class="kitchen-link" onclick="openD(\'' + id + '\')"><i>' + esc(icon) + '</i><span>' + esc(title) +
    '<small>' + esc(sub) + '</small></span><b class="muted">›</b></button>';
}

function docScreen(id){
  if (id === 'stock') return stockScreen();
  const doc = (D.docs || []).find(function(d){ return d.id === id; });
  if (!doc) return '';

  let h = '<button class="btn" onclick="openD(null)">← Кухня</button><div style="height:12px"></div>';
  h += '<div class="card"><h2>' + esc(doc.title) + '</h2>';
  if (doc.html) h += '<div class="md">' + doc.html + '</div>';

  let open = false;
  let first = true;
  for (const s of doc.sections){
    if (s.level === 1){
      // первый раздел часто повторяет название документа — он идёт вступлением, а не строкой списка
      if (first && !open && s.title.indexOf(doc.title) === 0){
        first = false;
        if (s.html) h += '<div class="md">' + s.html + '</div>';
        continue;
      }
      first = false;
      if (open) h += '</div></details>';
      h += '<details><summary>' + esc(s.title) + '</summary><div class="secbody">';
      if (s.html) h += '<div class="md">' + s.html + '</div>';
      open = true;
    } else {
      const body = '<div class="md">' + s.html + '</div>';
      h += open
        ? '<details class="sub"><summary>' + esc(s.title) + '</summary>' + body + '</details>'
