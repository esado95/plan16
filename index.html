<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>План</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14161a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#f4f2ee; --card:#fff; --line:#e2ddd4; --ink:#1d1f23; --muted:#6d7079;
  --a1:#a8532c; --a2:#2f6b57; --warn:#8a5a12;
  --shadow:0 1px 2px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#14161a; --card:#1c1f25; --line:#2b3038; --ink:#e8e6e1; --muted:#969ba6;
    --a1:#d97a4a; --a2:#5aab8c; --warn:#d3a04a;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;
}
/* Шапка и нижнее меню одинаковы на всех экранах: высота задана явно,
   иначе при пустом подзаголовке содержимое прыгает. */
header{
  position:fixed; top:0; left:0; right:0; z-index:5; background:var(--bg);
  height:calc(env(safe-area-inset-top) + 56px);
  padding:env(safe-area-inset-top) 16px 0;
  border-bottom:1px solid var(--line);
  display:flex; flex-direction:column; justify-content:center;
}
header h1,header .sub{margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
header h1{font-size:17px; font-weight:650; letter-spacing:-.01em; line-height:1.25}
header .sub{color:var(--muted); font-size:13px; line-height:1.3}
main{
  padding:16px 16px calc(env(safe-area-inset-bottom) + 78px);
  margin:calc(env(safe-area-inset-top) + 57px) auto 0; max-width:720px;
}
nav{
  position:fixed; left:0; right:0; bottom:0; z-index:6;
  display:flex; background:var(--card); border-top:1px solid var(--line);
  height:calc(env(safe-area-inset-bottom) + 54px);
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1; background:none; border:0; color:var(--muted); font:inherit; font-size:11px;
  padding:8px 2px 6px; cursor:pointer; line-height:1.25;
}
nav button b{display:block; font-size:17px; font-weight:400; margin-bottom:1px}
nav button.on{color:var(--a1)}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:14px 16px; margin-bottom:12px; box-shadow:var(--shadow);
}
.card.tight{padding:0; overflow:hidden}
h2{font-size:15px; font-weight:650; margin:0 0 10px; letter-spacing:-.01em}
h3{font-size:14px; font-weight:650; margin:16px 0 6px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:13px}
hr{border:0; border-top:1px solid var(--line); margin:14px 0}

/* шапка дня */
.day-head{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:2px}
.day-head .n{font-size:22px; font-weight:680; letter-spacing:-.02em}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.chip{
  font-size:13px; padding:5px 10px; border-radius:8px;
  background:color-mix(in srgb, var(--a1) 10%, transparent);
  color:var(--a1); border:1px solid color-mix(in srgb, var(--a1) 22%, transparent);
}
.chip.b{background:color-mix(in srgb, var(--a2) 10%, transparent); color:var(--a2);
  border-color:color-mix(in srgb, var(--a2) 22%, transparent)}
button.chip{cursor:pointer; font-family:inherit}

/* расписание */
.sched{margin:0; padding:0; list-style:none}
.sched li{display:flex; gap:12px; padding:6px 0; border-top:1px solid var(--line); font-size:14px}
.sched li:first-child{border-top:0}
.sched .t{color:var(--a1); font-variant-numeric:tabular-nums; font-weight:600; min-width:46px; flex:none}
.sched li.meal{align-items:flex-start}
.sched .body{flex:1}
.sched .tick{display:flex; gap:10px; align-items:flex-start; cursor:pointer}
.sched .tick input{width:20px; height:20px; margin:1px 0 0; accent-color:var(--a2); flex:none}
.sched .tick input:checked + span{color:var(--muted)}
.sched .more{
  background:none; border:0; color:var(--a1); font:inherit; font-size:13px;
  padding:5px 0 0 30px; cursor:pointer;
}
.sched li.detail{display:block; padding:2px 0 10px 58px; border-top:0}
.sched li.detail .md table{font-size:13px}

/* чек-лист */
.check{margin:0; padding:0; list-style:none}
.check li{border-top:1px solid var(--line)}
.check li:first-child{border-top:0}
.check label{display:flex; gap:11px; align-items:flex-start; padding:9px 0; cursor:pointer; font-size:14px}
.check input{width:21px; height:21px; margin:0; accent-color:var(--a2); flex:none}
.check input:checked + span{color:var(--muted); text-decoration:line-through}

/* поля ввода */
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(88px,1fr)); gap:10px}
.f{display:flex; flex-direction:column; gap:4px}
.f label{font-size:12px; color:var(--muted)}
input,select,textarea{
  font:inherit; font-size:16px; color:var(--ink); background:var(--bg);
  border:1px solid var(--line); border-radius:9px; padding:9px 10px; width:100%;
}
textarea{min-height:96px; resize:vertical; line-height:1.5; font-size:14px}
input:focus,textarea:focus,select:focus{outline:2px solid color-mix(in srgb,var(--a1) 45%,transparent); outline-offset:-1px}
.btn{
  display:inline-block; font:inherit; font-size:14px; font-weight:550;
  background:var(--bg); color:var(--ink); border:1px solid var(--line);
  border-radius:9px; padding:10px 14px; cursor:pointer; width:100%; text-align:center;
}
.btn.acc{background:var(--a1); border-color:var(--a1); color:#fff}
.btn + .btn{margin-top:8px}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.row2 .btn + .btn{margin-top:0}

/* списки */
.list{margin:0; padding:0; list-style:none}
.list li{border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list button{
  width:100%; text-align:left; background:none; border:0; font:inherit; color:inherit;
  padding:12px 16px; cursor:pointer; display:flex; gap:10px; align-items:baseline;
}
.list .k{color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; min-width:58px; flex:none}
.list .v{flex:1}
.list .v small{display:block; color:var(--muted); font-size:12.5px}
.list .chip{flex:none; align-self:center; font-size:12px; padding:3px 8px}
.list li.now{background:color-mix(in srgb,var(--a1) 7%,transparent)}
.list li.now .k{color:var(--a1); font-weight:600}

/* кухня */
.tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px}
.tile{
  background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden;
  cursor:pointer; padding:0; text-align:left; font:inherit; color:inherit;
}
.tile img{width:100%; aspect-ratio:4/5; object-fit:cover; display:block; background:var(--line)}
.tile span{display:block; padding:9px 10px; font-size:13.5px; line-height:1.35}
.photo{width:100%; border-radius:12px; display:block; margin-bottom:12px}

/* дневник */
.big{font-size:34px; font-weight:680; letter-spacing:-.03em; line-height:1.1}
.big span{font-size:15px; font-weight:400; color:var(--muted)}
.nums{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:10px 0 4px; text-align:center}
.nums div{background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:7px 2px}
.nums b{display:block; font-size:17px; font-weight:650; letter-spacing:-.01em}
.nums span{font-size:11px; color:var(--muted)}
.nums div.over b{color:var(--warn)}
.nums div.under b{color:var(--warn)}
.note{
  font-size:13px; margin-top:10px; padding:9px 12px; border-radius:9px;
  background:color-mix(in srgb,var(--warn) 12%,transparent); color:var(--ink);
}
.delta{font-size:14px; margin-top:4px}
.down{color:var(--a2)} .up{color:var(--warn)}
svg.chart{width:100%; height:150px; display:block; margin:8px 0 4px}

/* текст из markdown */
.md{font-size:14.5px}
.md :first-child{margin-top:0}
.md :last-child{margin-bottom:0}
.md h3{font-size:14px}
.md ul,.md ol{margin:0 0 10px; padding-left:20px}
.md li{margin-bottom:3px}
.md code{
  font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;
  background:var(--bg); border:1px solid var(--line); border-radius:5px; padding:1px 5px;
}
.md blockquote{
  margin:12px 0; padding:10px 13px; border-left:3px solid var(--a1);
  background:color-mix(in srgb,var(--a1) 7%,transparent); border-radius:0 8px 8px 0;
}
.md blockquote :last-child{margin-bottom:0}
.md table{width:100%; border-collapse:collapse; font-size:13.5px; margin:0 0 10px; display:block; overflow-x:auto}
.md th,.md td{border:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top}
.md th{background:var(--bg); font-weight:600}
.md .fill{display:inline-block; min-width:120px; border-bottom:1px solid var(--muted)}
details{border-top:1px solid var(--line)}
details:first-of-type{border-top:0}
summary{padding:11px 0; cursor:pointer; font-size:14px; font-weight:550; list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:'+ '; color:var(--a1); font-weight:400}
details[open] summary::before{content:'– '}
details .md{padding:0 0 12px}

.empty{text-align:center; padding:44px 20px; color:var(--muted)}
.empty p{max-width:340px; margin:0 auto 16px}
.hint{font-size:12.5px; color:var(--muted); margin-top:8px}
.saved{color:var(--a2); font-size:12.5px; height:16px; margin-top:6px}
</style>
</head>
<body>

<header>
  <h1 id="h-title">План</h1>
  <div class="sub" id="h-sub"></div>
</header>

<main id="view"></main>

<nav>
  <button data-tab="today" class="on"><b>◉</b>Сегодня</button>
  <button data-tab="plan"><b>▤</b>План</button>
  <button data-tab="food"><b>◍</b>Кухня</button>
  <button data-tab="more"><b>⚙</b>Ещё</button>
</nav>

<input type="file" id="file" accept=".json,application/json" hidden>

<script>
'use strict';

const DKEY = 'plan16.data';
const SKEY = 'plan16.state';
const WD = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const WD_SHORT = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const MON = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

let D = null;                 // содержимое: периоды, блюда, документы
let S = blank();              // дневник и настройки — только моё
let tab = 'today';
let openDay = null;           // какой день раскрыт на вкладке «План»
let openMeal = null;          // какой приём пищи раскрыт в распорядке
let openRecipe = null;

function blank(){ return {v:1, kind:'journal', log:{}, periods:[], rep:{}, ui:{}}; }

const REP = [1, 3, 7];                                            // возврат к теме: назавтра, через три дня, через неделю
const REP_LABEL = {1:'вчера', 3:'три дня назад', 7:'неделю назад'};

/* ─────────────── даты ─────────────── */

function iso(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function today(){ return iso(new Date()); }
function parse(s){ const p = String(s).split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function human(s){ const d = parse(s); return d.getDate() + ' ' + MON[d.getMonth()]; }
function humanFull(s){ const d = parse(s); return WD[d.getDay()] + ', ' + d.getDate() + ' ' + MON[d.getMonth()]; }
function shift(s, n){ const d = parse(s); d.setDate(d.getDate()+n); return iso(d); }
function diffDays(a, b){ return Math.round((parse(b) - parse(a)) / 86400000); }
function dowMon(s){ return (parse(s).getDay() + 6) % 7; }   // 0 = понедельник

/* ─────────────── хранилище ─────────────── */

function load(){
  try { const raw = localStorage.getItem(DKEY); if (raw) D = JSON.parse(raw); } catch(e){ D = null; }
  try { const raw = localStorage.getItem(SKEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch(e){ S = blank(); }
}
function save(){ try { localStorage.setItem(SKEY, JSON.stringify(S)); } catch(e){ alert('Не удалось сохранить: ' + e.message); } }
function saveData(){ try { localStorage.setItem(DKEY, JSON.stringify(D)); } catch(e){ alert('Файл слишком велик для хранилища браузера: ' + e.message); } }

/* ─────────────── периоды и дни ─────────────── */

function periods(){
  const list = (D && D.periods ? D.periods.slice() : []).concat(S.periods || []);
  return list.sort(function(a,b){ return a.start < b.start ? -1 : a.start > b.start ? 1 : 0; });
}

function periodFor(day){
  const list = periods();
  let found = null;
  for (const p of list){
    if (p.start <= day && (!p.end || p.end >= day)) found = p;   // при наложении берём последний заведённый
  }
  return found;
}

function currentPeriod(){
  const p = periodFor(today());
  if (p) return p;
  const list = periods();
  if (!list.length) return null;
  // до старта — ближайший будущий, после конца — последний
  const future = list.filter(function(x){ return x.start > today(); });
  return future.length ? future[0] : list[list.length-1];
}

function dayFor(day){
  const p = periodFor(day);
  if (!p) return null;
  if (p.kind === 'weekly'){
    const w = (p.week || [])[dowMon(day)] || {};
    return {
      period: p, n: diffDays(p.start, day) + 1, date: day, weekday: WD[parse(day).getDay()],
      gym: w.gym || '', topic: w.topic || '', lunch: w.lunch || '', dinner: w.dinner || '',
      html: w.note ? '<p>' + esc(w.note).replace(/\n/g,'<br>') + '</p>' : ''
    };
  }
  const d = (p.days || []).find(function(x){ return x.date === day; });
  return d ? Object.assign({period:p}, d) : null;
}

/* ─────────────── возврат к темам ─────────────── */

function repKey(pid, title){ return pid + '|' + title; }

/* Что сегодня в возврате. Считается от дат, а не от номеров дней,
   поэтому работает и в недельном периоде, и на стыке двух периодов. */
function dueOn(day){
  const out = [];
  for (const gap of REP){
    const d = dayFor(shift(day, -gap));
    if (d && d.topic && d.study !== false){
      out.push({gap: gap, date: shift(day, -gap), title: d.topic, key: repKey(d.period.id, d.topic)});
    }
  }
  return out;
}

function repDone(key, gap){ return !!(S.rep[key] || {})[gap]; }

function topicState(title, pid, date){
  const r = S.rep[repKey(pid, title)] || {};
  const done = REP.filter(function(g){ return r[g]; }).length;
  if (r.closed || done >= REP.length) return {t: 'закрыта', c: ' b'};
  if (date && date > today()) return {t: 'впереди', c: ''};
  if (date && date === today()) return {t: 'сегодня', c: ''};
  return {t: 'возвратов ' + done + ' из ' + REP.length, c: ''};
}

function toggleTopic(key){
  const r = S.rep[key] || (S.rep[key] = {});
  if (r.closed) delete r.closed; else r.closed = 1;
  save();
  render();
}

/* ─────────────── мелочи ─────────────── */

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}
function num(v){ const n = parseFloat(String(v).replace(',','.')); return isFinite(n) ? n : null; }
function fmt(n, d){ return n == null ? '—' : n.toFixed(d == null ? 1 : d).replace('.', ','); }
function plural(n, one, few, many){
  const a = Math.abs(n) % 100, b = a % 10;
  return n + ' ' + (a > 10 && a < 20 ? many : b === 1 ? one : b > 1 && b < 5 ? few : many);
}

const ALIAS = {'рататуй':'ratatouille','омлет':'omelette','лосось':'saumon','креветк':'crevettes',
  'чечевиц':'lentilles','курица':'poulet','курицу':'poulet','салат':'salade','яйц':'oeufs'};

function norm(s){
  let t = String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  for (const k in ALIAS) if (t.indexOf(k) >= 0) t += ' ' + ALIAS[k];
  return ' ' + t.replace(/[^a-zа-яё0-9]+/gi,' ').trim() + ' ';
}

function findRecipe(text){
  if (!D || !D.recipes || !text) return null;
  const t = norm(text);
  let best = null, bestLen = 0;
  for (const r of D.recipes){
    for (const w of norm(r.title).trim().split(' ')){
      if (w.length >= 5 && t.indexOf(' ' + w) >= 0 && w.length > bestLen){ best = r; bestLen = w.length; }
    }
  }
  return best;
}

/* ─────────────── вкладка «Сегодня» ─────────────── */

function viewToday(){
  if (!D) return viewEmpty();
  const day = today();
  const d = dayFor(day);
  const p = d ? d.period : currentPeriod();

  if (!d){
    const gap = p && p.start > day
      ? 'Период «' + esc(p.title) + '» начинается ' + human(p.start) + '.'
      : (p ? 'Период «' + esc(p.title) + '» закончился ' + human(p.end || p.start) + '.' : '');
    return '<div class="card"><h2>На сегодня плана нет</h2><p class="muted small">' + gap +
      ' Заведи новый период в «Ещё» — расписание и чек-лист задаются там, дневник продолжится без разрыва.</p>' +
      '<button class="btn acc" onclick="go(\'more\')">Открыть настройки</button></div>' + logForm(day, null);
  }

  let h = logForm(day, d.period);   // день начинается с весов, поэтому запись первая

  h += '<div class="card">';
  h += '<div class="day-head"><span class="n">День ' + d.n + '</span>' +
       '<span class="muted small">' + esc(humanFull(day)) +
       (d.period.kind === 'plan' && d.period.days ? ' · из ' + d.period.days.length : '') + '</span></div>';
  h += '<div class="chips">';
  if (d.gym) h += '<span class="chip">Зал: ' + esc(d.gym) + '</span>';
  if (d.topic) h += '<span class="chip b">' + esc(d.topic) + '</span>';
  h += '</div>';
  const meals = [['Обед', d.lunch], ['Ужин', d.dinner]].filter(function(m){ return m[1]; });
  if (meals.length){
    h += '<div class="chips">';
    for (const m of meals){
      const r = findRecipe(m[1]);
      h += r
        ? '<button class="chip" onclick="openR(\'' + r.id + '\')">' + m[0] + ': ' + esc(m[1]) + ' →</button>'
        : '<span class="chip">' + m[0] + ': ' + esc(m[1]) + '</span>';
    }
    h += '</div>';
  }
  h += '</div>';

  h += repCard(day);
  h += scheduleCard(d, day);

  h += themeCard(d);
  if (d.html) h += '<div class="card"><h2>Сегодня по плану</h2><div class="md">' + d.html + '</div></div>';
  h += frCard(d);

  h += checklist(day, d.period);
  return h;
}

/* ─────────────── гарнир ─────────────── */

function range(text){
  const m = String(text || '').match(/(\d+)(?:\s*[–—-]\s*(\d+))?/);
  return m ? [+m[1], m[2] ? +m[2] : +m[1]] : null;
}

function nut(){ return D && D.nutrition && D.nutrition.meals ? D.nutrition : null; }

function chosenSide(day){
  const N = nut();
  if (!N || !N.sides || !N.sides.length) return null;
  const e = S.log[day] || {};
  return N.sides.find(function(s){ return s.name === e.side; }) || N.sides[0];
}

/* Вес гарнира под ту же энергию, что у гарнира по плану. */
function sideGrams(sel){
  const N = nut();
  return Math.round(N.side.kcal / sel.kcal * 100);
}

function isSideMeal(meal){
  const N = nut();
  return !!(N && N.side && N.side.meal === meal.title);
}

/* Итог приёма с учётом выбранного гарнира. */
function mealTotal(meal, day){
  const N = nut();
  const t = meal.total || {p:0, f:0, c:0, kcal:0};
  const out = {p: t.p, f: t.f, c: t.c, kcal: t.kcal};
  const sel = chosenSide(day);
  if (isSideMeal(meal) && sel && sel.name !== N.side.name){
    const g = sideGrams(sel);
    out.p += sel.p * g / 100 - N.side.p;
    out.f += sel.f * g / 100 - N.side.f;
    out.c += sel.c * g / 100 - N.side.c;
    out.kcal += sel.kcal * g / 100 - N.side.kcal;
  }
  return out;
}

/* Съедено за день — только по отмеченным приёмам, а не по плану. */
function eaten(day){
  const N = nut();
  const done = (S.log[day] || {}).meals || {};
  const sum = {p:0, f:0, c:0, kcal:0};
  if (!N) return sum;
  N.meals.forEach(function(m, i){
    if (!done[i + 1]) return;
    const t = mealTotal(m, day);
    sum.p += t.p; sum.f += t.f; sum.c += t.c; sum.kcal += t.kcal;
  });
  return sum;
}

function scheduleCard(d, day){
  const p = d.period;
  if (!p.schedule || !p.schedule.length) return '';
  const N = nut();
  const done = (S.log[day] || {}).meals || {};

  let h = '<div class="card"><h2>Распорядок</h2><ul class="sched">';
  for (const s of p.schedule){
    const m = N ? /Приём\s*(\d)/.exec(String(s.s).replace(/<[^>]+>/g, '')) : null;
    const idx = m ? +m[1] : 0;
    const meal = idx ? N.meals[idx - 1] : null;

    if (!meal){
      h += '<li><span class="t">' + esc(s.t) + '</span><span>' + s.s + '</span></li>';
      continue;
    }
    h += '<li class="meal"><span class="t">' + esc(s.t) + '</span><span class="body">' +
      '<label class="tick"><input type="checkbox" data-meal="' + idx + '"' + (done[idx] ? ' checked' : '') +
      '><span>' + s.s + '</span></label>' +
      '<button class="more" onclick="toggleMeal(' + idx + ')">' +
      (openMeal === idx ? 'скрыть состав' : 'состав и гарнир') + '</button></span></li>';
    if (openMeal === idx) h += '<li class="detail">' + mealDetail(meal, day) + '</li>';
  }
  h += '</ul>' + eatenBlock(day) + '</div>';
  return h;
}

function toggleMeal(idx){ openMeal = openMeal === idx ? null : idx; render(); }

function mealDetail(meal, day){
  const N = nut();
  const sel = chosenSide(day);
  const swap = isSideMeal(meal) && sel;
  const g = swap ? sideGrams(sel) : 0;

  let h = '<div class="md"><table><tr><th>Что</th><th>Вес</th><th>Б</th><th>Ж</th><th>У</th><th>Ккал</th></tr>';
  for (const it of meal.items){
    const mine = swap && it.name === N.side.name;
    const row = mine
      ? {name: sel.name, weight: g + ' г', p: sel.p * g / 100, f: sel.f * g / 100, c: sel.c * g / 100, kcal: sel.kcal * g / 100}
      : it;
    h += '<tr><td>' + esc(row.name) + '</td><td>' + esc(row.weight) + '</td><td>' +
      Math.round(row.p) + '</td><td>' + Math.round(row.f) + '</td><td>' +
      Math.round(row.c) + '</td><td>' + Math.round(row.kcal) + '</td></tr>';
  }
  const t = mealTotal(meal, day);
  h += '<tr><td><b>Итого</b></td><td></td><td><b>' + Math.round(t.p) + '</b></td><td><b>' +
    Math.round(t.f) + '</b></td><td><b>' + Math.round(t.c) + '</b></td><td><b>' +
    Math.round(t.kcal) + '</b></td></tr></table></div>';

  if (swap){
    h += '<div class="f" style="margin-top:8px"><label>Гарнир</label><select data-side>';
    for (const s of N.sides){
      h += '<option value="' + esc(s.name) + '"' + (s.name === sel.name ? ' selected' : '') + '>' +
        esc(s.name) + ' — ' + esc(s.ru) + (s.name === N.side.name ? ' · по плану' : '') + '</option>';
    }
    h += '</select></div>';
  }
  return h;
}

function eatenBlock(day){
  const N = nut();
  if (!N) return '';
  const s = eaten(day);
  const cell = function(v, norm, label){
    return '<div><b>' + Math.round(v) + '</b><span>' + label + ' из ' + norm + '</span></div>';
  };
  const np = range(N.norm.p), nf = range(N.norm.f), nc = range(N.norm.c), nk = range(N.norm.kcal);
  let h = '<div class="nums">' +
    cell(s.p, np ? np[0] : '?', 'белок') +
    cell(s.f, nf ? nf[1] : '?', 'жиры') +
    cell(s.c, nc ? nc[1] : '?', 'углеводы') +
    cell(s.kcal, nk ? nk[1] : '?', 'ккал') +
    '</div>';

  const done = (S.log[day] || {}).meals || {};
  const count = N.meals.filter(function(_, i){ return done[i + 1]; }).length;
  h += '<p class="small muted">Съедено за день — по отмеченным приёмам, ' +
    (count ? count + ' из ' + N.meals.length : 'пока ни одного') + '.</p>';

  if (count === N.meals.length && np && s.p < np[0] - 5){
    const need = Math.round(np[0] - s.p);
    const list = (N.proteinFix || []).slice().sort(function(a, b){ return a.kcal - b.kcal; });
    const fit = list.filter(function(f){ return f.p >= need; });
    const pick = (fit.length ? fit : list.slice(-1)).slice(0, 2);
    h += '<div class="note">Оба приёма съедены, а белка не хватает ' + need + ' г. Добери: ' +
      pick.map(function(f){ return f.what + ' — ' + f.p + ' г, ' + f.kcal + ' ккал'; }).join(' или ') + '.</div>';
  }
  return h;
}

function themeOf(d){
  return d && d.theme && D && D.curriculum ? D.curriculum[d.theme - 1] : null;
}

function points(list){
  return '<ul>' + list.map(function(p){ return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>';
}

function themeCard(d){
  const t = themeOf(d);
  if (!t) return '';
  let h = '<div class="card"><h2>Тема дня</h2>';
  h += '<p class="small muted">Прочитал заметку в Obsidian, закрыл, рассказал вслух по пунктам. Что не вспомнилось — открыл и отметил красным.</p>';
  for (const m of t.modules){
    h += '<details><summary>' + esc(m.code) + ' · ' + esc(m.title) + '</summary><div class="md">' +
      '<p class="muted small">' + esc(m.note) + '</p>' + points(m.points) + '</div></details>';
  }
  return h + '</div>';
}

function frCard(d){
  const t = themeOf(d);
  if (!t) return '';
  const mods = t.modules.filter(function(m){ return m.frPoints && m.frPoints.length; });
  if (!mods.length) return '';
  let h = '<div class="card"><h2>Французский · 19:30</h2>' +
    '<p class="small muted">Час на диктофон, по разделам той же темы. Потом прослушать и отметить, где сбивался на русский.</p>';
  for (const m of mods){
    h += '<details><summary>' + esc(m.fr || m.code) + '</summary><div class="md">' + points(m.frPoints) + '</div></details>';
  }
  return h + '</div>';
}

function repCard(day){
  const due = dueOn(day);
  if (!due.length) return '';
  const done = due.filter(function(x){ return repDone(x.key, x.gap); }).length;
  let h = '<div class="card"><h2>Возврат <span class="muted small" id="rep-n">' + done + ' из ' + due.length + '</span></h2>';
  h += '<p class="small muted">Конспект закрыт, рассказываешь вслух. Что не вспомнилось — открыл и отметил.</p><ul class="check">';
  for (const x of due){
    h += '<li><label><input type="checkbox" data-rep="' + esc(x.key) + '" data-gap="' + x.gap + '"' +
      (repDone(x.key, x.gap) ? ' checked' : '') + '><span>' + esc(x.title) +
      ' <small class="muted">· ' + REP_LABEL[x.gap] + '</small></span></label></li>';
  }
  return h + '</ul></div>';
}

function checklist(day, p){
  const items = (p && p.checklist) || [];
  if (!items.length) return '';
  const e = S.log[day] || {};
  const ok = e.pid === p.id ? (e.check || {}) : {};
  // дата уже стоит в карточке записи, счёт видно по галочкам — в заголовке лишнее
  let h = '<div class="card"><h2>Чек-лист</h2><ul class="check">';
  items.forEach(function(t, i){
    h += '<li><label><input type="checkbox" data-check="' + i + '"' + (ok[i] ? ' checked' : '') + '><span>' + esc(t) + '</span></label></li>';
  });

}

function logForm(day, p){
  const e = S.log[day] || {};
  let h = '<div class="card"><h2>Запись за ' + human(day) + '</h2><div class="grid">';
  h += field('w', 'Вес, кг', e.w, 'decimal');

       '<textarea data-log="note" style="min-height:64px">' + esc(e.note || '') + '</textarea></div>';

function field(k, label, v, mode){
  return '<div class="f"><label>' + label + '</label>' +

  if (!p) return '<div class="card"><p class="muted">Ни одного периода не заведено.</p></div>';

  if (p.kind === 'weekly'){

function topicsCard(p){
  const items = [];

    (p.week || []).forEach(function(w, i){ if (w.topic) items.push({title: w.topic, when: WD_SHORT[i], date: ''}); });

  const closed = items.filter(function(x){ return topicState(x.title, p.id, x.date).t === 'закрыта'; }).length;

    '<p class="small muted">Темы идут в том же порядке, что на курсах. Экзамены, проект, английский и мастерская CV в повторение не входят. ' +
    'Возвраты отмечаются на вкладке «Сегодня»: назавтра, через три дня, через неделю. Три отметки закрывают тему сами, нажатие на строку — вручную.</p></div>';
  h += '<div class="card tight"><ul class="list">';
  for (const x of items){
    const st = topicState(x.title, p.id, x.date);
    h += '<li' + (x.date === today() ? ' class="now"' : '') + '>' +
      '<button onclick="toggleTopic(\'' + esc(repKey(p.id, x.title)).replace(/'/g, "\\'") + '\')">' +
      '<span class="k">' + esc(x.when) + '</span>' +
      '<span class="v">' + esc(x.title) + (x.sub ? '<small>' + esc(x.sub) + '</small>' : '') + '</span>' +
      '<span class="chip' + st.c + '">' + st.t + '</span></button></li>';
  }

}

/* ─────────────── вкладка «Дневник» ─────────────── */

function entries(){
  return Object.keys(S.log).sort().map(function(k){ return Object.assign({date:k}, S.log[k]); });
}

function avg7(list, i){
  const from = shift(list[i].date, -6);
  const win = list.filter(function(x, j){ return j <= i && x.date >= from && x.w != null; });
  if (!win.length) return null;
  return win.reduce(function(s,x){ return s + x.w; }, 0) / win.length;
}

function viewLog(){
  const list = entries().filter(function(e){ return e.w != null; });
  let h = '';

  if (list.length){
    const last = avg7(list, list.length-1);
    const first = list[0].w;
    const delta = last - first;
    h += '<div class="card">';
    h += '<div class="big">' + fmt(last) + ' <span>кг · среднее за 7 дней</span></div>';
    h += '<div class="delta ' + (delta <= 0 ? 'down' : 'up') + '">' +
      (delta <= 0 ? '−' : '+') + fmt(Math.abs(delta)) + ' кг от старта ' + human(list[0].date) +
      ' · ' + plural(list.length, 'запись', 'записи', 'записей') + '</div>';
    h += chart(list);
    h += '<p class="hint">Одна цифра ничего не значит: вода гуляет на 1–2 кг. Смотри линию среднего.</p>';
    h += '</div>';
  } else {
    h += '<div class="card"><p class="muted">Ни одного взвешивания. Запиши вес на вкладке «Сегодня» — график появится со второй записи.</p></div>';
  }

  const meas = entries().filter(function(e){ return e.neck != null || e.waist != null; });
  if (meas.length){
    h += '<div class="card"><h2>Замеры</h2><div class="md"><table><tr><th>Дата</th><th>Шея</th><th>Талия</th></tr>';
    for (const e of meas) h += '<tr><td>' + human(e.date) + '</td><td>' + fmt(e.neck) + '</td><td>' + fmt(e.waist) + '</td></tr>';
    h += '</table></div></div>';
  }

  const all = entries();
  if (all.length){
    h += '<div class="card tight"><ul class="list">';
    for (const e of all.slice().reverse()){
      const done = e.check ? Object.keys(e.check).filter(function(k){ return e.check[k]; }).length : 0;
      const bits = [];
      if (e.w != null) bits.push(fmt(e.w) + ' кг');
      if (e.sleep != null) bits.push('сон ' + fmt(e.sleep) + ' ч');
      if (e.mood != null) bits.push('сам. ' + e.mood);
      const meals = e.meals ? Object.keys(e.meals).length : 0;
      if (meals) bits.push('приёмов ' + meals);
      if (done) bits.push('чек-лист ' + done);
      h += '<li><button onclick="editDay(\'' + e.date + '\')"><span class="k">' + human(e.date) + '</span>' +
        '<span class="v">' + (bits.join(' · ') || '—') + (e.note ? '<small>' + esc(e.note) + '</small>' : '') + '</span></button></li>';
    }
    h += '</ul></div>';
  }

  h += '<div class="card"><h2>Копия</h2><p class="small muted">Записи лежат в браузере. Safari чистит хранилище сайта после недели без визитов, поэтому копию стоит сохранять раз в несколько дней. В файл попадают и заведённые тобой периоды.</p>' +
    '<div class="row2"><button class="btn" onclick="exportLog()">Сохранить</button><button class="btn" onclick="pick()">Загрузить</button></div></div>';
  return h;
}

function chart(list){
  const W = 320, H = 150, PL = 34, PR = 6, PT = 10, PB = 18;
  const ws = list.map(function(e){ return e.w; });
  const avgs = list.map(function(_, i){ return avg7(list, i); });
  let lo = Math.min.apply(null, ws), hi = Math.max.apply(null, ws);
  if (hi - lo < 2){ const m = (hi+lo)/2; lo = m-1; hi = m+1; }
  const pad = (hi-lo) * 0.12; lo -= pad; hi += pad;
  const n = list.length;
  const x = function(i){ return n < 2 ? PL : PL + i * (W-PL-PR) / (n-1); };
  const y = function(v){ return PT + (hi-v) * (H-PT-PB) / (hi-lo); };

  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">';
  for (let g = 0; g < 3; g++){
    const v = lo + (hi-lo) * g / 2;
    s += '<line x1="' + PL + '" y1="' + y(v).toFixed(1) + '" x2="' + (W-PR) + '" y2="' + y(v).toFixed(1) +
         '" stroke="var(--line)" stroke-width="1"/>' +
         '<text x="2" y="' + (y(v)+3.5).toFixed(1) + '" font-size="9" fill="var(--muted)">' + fmt(v,0) + '</text>';
  }
  s += '<polyline fill="none" stroke="var(--line)" stroke-width="1.5" points="' +
    list.map(function(e,i){ return x(i).toFixed(1) + ',' + y(e.w).toFixed(1); }).join(' ') + '"/>';
  s += '<polyline fill="none" stroke="var(--a1)" stroke-width="2.5" stroke-linejoin="round" points="' +
    avgs.map(function(v,i){ return v == null ? '' : x(i).toFixed(1) + ',' + y(v).toFixed(1); }).filter(Boolean).join(' ') + '"/>';
  for (let i = 0; i < n; i++) s += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(ws[i]).toFixed(1) + '" r="2" fill="var(--muted)"/>';
  s += '<text x="' + PL + '" y="' + (H-4) + '" font-size="9" fill="var(--muted)">' + human(list[0].date) + '</text>';
  if (n > 1) s += '<text x="' + (W-PR) + '" y="' + (H-4) + '" font-size="9" fill="var(--muted)" text-anchor="end">' + human(list[n-1].date) + '</text>';
  return s + '</svg>';
}

    h += '<p class="small muted">Загружен ' + esc(D.generated || '—') + ' · ' +
      plural((D.recipes||[]).length, 'блюдо', 'блюда', 'блюд') +
      ', из них с фото ' + withPhoto + ' · ' +
      plural(p.length, 'период', 'периода', 'периодов') + '</p>';
  } else {
    h += '<p class="small muted">Файл не загружен — приложение пустое.</p>';
  }
  h += '<button class="btn acc" onclick="pick()">Загрузить файл</button>';
  h += '<p class="hint">Одна кнопка на оба файла: и на план, и на копию дневника — приложение само разберётся, что внутри.</p></div>';

  h += '<div class="card"><h2>Периоды</h2>' +
    '<p class="small muted">Приложение показывает тот период, в который попадает сегодняшняя дата. Когда рывок кончится, заведи обычный — дневник и кухня останутся общими.</p>' +
    '<div class="card tight" style="margin:0 0 10px"><ul class="list">';
  for (const p of periods()){
    const mine = (S.periods || []).some(function(x){ return x.id === p.id; });
    const cur = periodFor(today()) && periodFor(today()).id === p.id;
    h += '<li' + (cur ? ' class="now"' : '') + '><button ' + (mine ? 'onclick="editPeriod(\'' + p.id + '\')"' : 'disabled style="opacity:.75"') + '>' +
      '<span class="v">' + esc(p.title) + '<small>' + human(p.start) + (p.end ? ' — ' + human(p.end) : ' — без конца') +
      (mine ? '' : ' · из файла') + '</small></span>' + (mine ? '<span class="muted small">изменить</span>' : '') + '</button></li>';
  }
  h += '</ul></div><button class="btn" onclick="editPeriod(null)">Новый период</button></div>';

  h += '<div class="card"><h2>Сброс</h2>' +
    '<p class="small muted">Стирает записи дневника и заведённые периоды. План, программа и рецепты останутся.</p>' +
    '<button class="btn" onclick="wipe()">Стереть всё</button></div>';

  return h;
}

function editPeriod(id){
  const p = (S.periods || []).find(function(x){ return x.id === id; }) || {
    id: 'p' + Date.now(), kind: 'weekly', title: '', start: today(), end: '',
    schedule: [], checklist: [], week: [0,1,2,3,4,5,6].map(function(){ return {gym:'',topic:'',lunch:'',dinner:'',note:''}; })
  };
  const sched = (p.schedule || []).map(function(s){ return s.t + ' ' + String(s.s).replace(/<[^>]+>/g,''); }).join('\n');

  let h = '<button class="btn" onclick="go(\'more\')">← Назад</button><div style="height:12px"></div>';
  h += '<div class="card"><h2>Период</h2>';
  h += '<div class="f"><label>Название</label><input id="p-title" value="' + esc(p.title) + '" placeholder="Обычный режим"></div>';
  h += '<div class="row2" style="margin-top:10px">' +
    '<div class="f"><label>Начало</label><input id="p-start" type="date" value="' + esc(p.start) + '"></div>' +
    '<div class="f"><label>Конец, можно пусто</label><input id="p-end" type="date" value="' + esc(p.end || '') + '"></div></div>';
  h += '</div>';

  h += '<div class="card"><h2>Распорядок</h2><p class="small muted">По строке на пункт: время, пробел, что делаешь.</p>' +
    '<textarea id="p-sched" placeholder="07:00 Подъём, весы&#10;08:30 Дорога&#10;19:00 Ужин">' + esc(sched) + '</textarea></div>';

  h += '<div class="card"><h2>Чек-лист дня</h2><p class="small muted">По строке на пункт.</p>' +
    '<textarea id="p-check" placeholder="Взвесился&#10;10 000 шагов&#10;Белок 200 г">' + esc((p.checklist||[]).join('\n')) + '</textarea></div>';

  h += '<div class="card"><h2>Неделя</h2><p class="small muted">Что в этот день недели: нагрузка, тема, заметка.</p>';
  for (let i = 0; i < 7; i++){
    const w = (p.week || [])[i] || {};
    h += '<h3>' + WD_SHORT[i] + '</h3><div class="row2">' +
      '<div class="f"><input id="w-gym-' + i + '" value="' + esc(w.gym || '') + '" placeholder="Зал / кардио / отдых"></div>' +
      '<div class="f"><input id="w-topic-' + i + '" value="' + esc(w.topic || '') + '" placeholder="Тема"></div></div>' +
      '<div class="f" style="margin-top:8px"><input id="w-note-' + i + '" value="' + esc(w.note || '') + '" placeholder="Заметка"></div>';
  }
  h += '</div>';

  h += '<button class="btn acc" onclick="savePeriod(\'' + p.id + '\')">Сохранить период</button>';
  if ((S.periods || []).some(function(x){ return x.id === p.id; })){
    h += '<button class="btn" onclick="delPeriod(\'' + p.id + '\')">Удалить период</button>';
  }

  document.getElementById('view').innerHTML = h;
  document.getElementById('h-title').textContent = 'Период';
  document.getElementById('h-sub').textContent = 'Своё расписание';
  window.scrollTo(0,0);
}

function savePeriod(id){
  const v = function(x){ const el = document.getElementById(x); return el ? el.value.trim() : ''; };
  const p = {
    id: id, kind: 'weekly',
    title: v('p-title') || 'Мой режим',
    start: v('p-start') || today(),
    end: v('p-end'),
    schedule: v('p-sched').split('\n').map(function(line){
      const m = line.trim().match(/^(\d{1,2}[:.]\d{2})\s+(.+)$/);
      return m ? {t: m[1].replace('.',':'), s: esc(m[2])} : null;
    }).filter(Boolean),
    checklist: v('p-check').split('\n').map(function(s){ return s.trim(); }).filter(Boolean),
    week: [0,1,2,3,4,5,6].map(function(i){
      return {gym: v('w-gym-'+i), topic: v('w-topic-'+i), lunch: '', dinner: '', note: v('w-note-'+i)};
    })
  };
  S.periods = (S.periods || []).filter(function(x){ return x.id !== id; });
  S.periods.push(p);
  save();
  go('more');
}

function delPeriod(id){
  if (!confirm('Удалить период? Записи дневника останутся.')) return;
  S.periods = (S.periods || []).filter(function(x){ return x.id !== id; });
  save();
  go('more');
}

function wipe(){
  if (!confirm('Стереть все записи дневника и заведённые периоды? План и рецепты останутся.')) return;
  if (!confirm('Точно? Отменить будет нельзя.')) return;
  S = blank();
  save();
  go('more');
}

/* ─────────────── файлы ─────────────── */

function pick(){ document.getElementById('file').click(); }

document.getElementById('file').addEventListener('change', function(ev){
  const f = ev.target.files && ev.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = function(){
    let obj;
    try { obj = JSON.parse(r.result); }
    catch(e){ alert('Это не JSON: ' + e.message); return; }

    if (obj.periods && obj.docs){
      D = obj; saveData();
      alert('План загружен: ' + (obj.periods[0] ? obj.periods[0].title : '') + '.');
    } else if (obj.kind === 'journal' || obj.log){
      const n = Object.keys(obj.log || {}).length;
      if (!confirm('В файле ' + plural(n, 'запись', 'записи', 'записей') + '. Заменить текущий дневник?')) return;
      S = Object.assign(blank(), obj);
      save();
      alert('Дневник восстановлен.');
    } else {
      alert('Не понял, что это за файл: нет ни плана, ни записей.');
      return;
    }
    ev.target.value = '';
    render();
  };
  r.readAsText(f);
});

function exportLog(){
  const out = JSON.stringify({v:1, kind:'journal', saved: today(), log: S.log, rep: S.rep, periods: S.periods, ui: S.ui}, null, 1);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([out], {type:'application/json'}));
  a.download = 'plan16-journal-' + today() + '.json';
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
}

/* ─────────────── ввод ─────────────── */

function bind(date){
  const view = document.getElementById('view');
  const flash = function(){
    const el = document.getElementById('saved');
    if (!el) return;
    el.textContent = 'сохранено';
    clearTimeout(flash.t);
    flash.t = setTimeout(function(){ if (el) el.textContent = ''; }, 1200);
  };

  view.querySelectorAll('[data-log]').forEach(function(el){
    el.addEventListener('change', function(){
      const e = S.log[date] || (S.log[date] = {});
      const k = el.dataset.log;
      if (k === 'note'){
        const t = el.value.trim();
        if (t) e.note = t; else delete e.note;
      } else {
        const n = num(el.value);
        if (n == null) delete e[k]; else e[k] = n;
      }
      if (!Object.keys(e).length) delete S.log[date];
      save();
      flash();
    });
  });

  view.querySelectorAll('[data-check]').forEach(function(el){
    el.addEventListener('change', function(){
      const p = periodFor(date);
      const e = S.log[date] || (S.log[date] = {});
      if (e.pid !== (p && p.id)){ e.pid = p && p.id; e.check = {}; }
      if (!e.check) e.check = {};
      if (el.checked) e.check[el.dataset.check] = 1; else delete e.check[el.dataset.check];
      save();
    });
  });

  view.querySelectorAll('[data-side]').forEach(function(el){
    el.addEventListener('change', function(){
      (S.log[date] || (S.log[date] = {})).side = el.value;
      save();
      render();
    });
  });

  view.querySelectorAll('[data-meal]').forEach(function(el){
    el.addEventListener('change', function(){
      const e = S.log[date] || (S.log[date] = {});
      if (!e.meals) e.meals = {};
      if (el.checked) e.meals[el.dataset.meal] = 1; else delete e.meals[el.dataset.meal];
      save();
      render();                       // пересчитываем «съедено за день»
    });
  });

  view.querySelectorAll('[data-rep]').forEach(function(el){
    el.addEventListener('change', function(){
      const r = S.rep[el.dataset.rep] || (S.rep[el.dataset.rep] = {});
      if (el.checked) r[el.dataset.gap] = 1; else delete r[el.dataset.gap];
      save();
      count('rep-n', '[data-rep]');
    });
  });

  function count(id, sel){
    const label = document.getElementById(id);
    if (label) label.textContent = view.querySelectorAll(sel + ':checked').length + ' из ' + view.querySelectorAll(sel).length;
  }
}

/* ─────────────── каркас ─────────────── */

function render(){
  const view = document.getElementById('view');
  const p = currentPeriod();

  document.getElementById('h-title').textContent =
    tab === 'today' ? (p ? p.title : 'План') :
    tab === 'plan' ? 'План' : tab === 'food' ? 'Кухня' : 'Ещё';

  document.getElementById('h-sub').textContent =
    tab === 'today' ? humanFull(today()) :
    tab === 'plan' ? (p ? human(p.start) + (p.end ? ' — ' + human(p.end) : ' — без конца') : 'Периодов нет') :
    tab === 'food' ? 'Блюда, соусы, рацион' : 'Дневник, файл, периоды';

  view.innerHTML =
    tab === 'today' ? viewToday() :
    tab === 'plan' ? viewPlan() :
    tab === 'food' ? viewFood() : viewMore();

  if (tab === 'today') bind(today());

  document.querySelectorAll('nav button').forEach(function(b){
    b.classList.toggle('on', b.dataset.tab === tab);
  });
}

function go(t){ tab = t; openRecipe = null; render(); window.scrollTo(0,0); }

document.querySelectorAll('nav button').forEach(function(b){
  b.addEventListener('click', function(){ go(b.dataset.tab); });
});

load();
render();

if ('serviceWorker' in navigator){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
</body>
